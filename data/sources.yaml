    priority: P0
  - id: cbic-taxinfo-api
    name: CBIC Tax Information Portal API (GST and Customs notifications and circulars)
    publisher: CBIC, Department of Revenue, Ministry of Finance
    url: https://taxinformation.cbic.gov.in/api/cbic-notification-msts/fetchUpdatesByTaxId/1000001
    category: regulatory-feed
    format:
      - JSON
      - API
      - PDF
    access: open
    license: Unknown - GoI website, no open licence stated
    updates: on publication
    reachable:
      status: 200
      checked: 2026-10-14
      note: "GET 200; application/json; 3 KB transferred; JSON list of 4. JHipster API found in the portal main.js. Token POST returned a ROLE_ANONYMOUS JWT; GST updates returned 4 items; the Central Tax category returned 521 notifications (newest 02/2026-Central Tax dated 2026-05-07); GST circulars returned 272. OpenSSL check: 'unable to get local issuer certificate'."
    machineReadable: true
    useInCalendar: Authoritative CGST/IGST notifications (including due-date extensions such as 01/2026-Central Tax for GSTR-3B), CBIC GST circulars and Customs notifications - the official source for GST overrides.
    ingestion: "POST https://taxinformation.cbic.gov.in/api/authenticate-token with an empty body to get an anonymous JWT (id_token), then GET with Authorization: Bearer <token>: /api/cbic-notification-msts/fetchUpdatesByTaxId/1000001 (latest GST items), /api/cbic-notification-msts/fetchNotificationByCategory/1000001/Central%20Tax (full Central Tax list), /api/cbic-circular-msts/fetchAllCircularsByTaxId/1000001 (GST circulars). Tax ids: 1000001 GST, 1000002 Customs, 1000003 Central Excise, 1000004 Service Tax. PDF path in docFilePath. Poll daily. The server sends an incomplete certificate chain: ship the intermediate CA in the repo and pass it to curl/requests on Ubuntu runners."
    priority: P0
    used: true
    usedFor: Source register of CGST notifications behind the GST rules and extensions.
