  - id: archive-org-gazette-of-india
    name: Internet Archive 'gazetteofindia' collection (central and state gazettes)
    publisher: Internet Archive (uploads by Indian Kanoon)
    url: https://archive.org/advancedsearch.php?q=collection%3Agazetteofindia+AND+identifier%3Ain.gazette.central*&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=date&sort%5B%5D=date+desc&rows=50&output=json
