# Catalogue of open datasets and official sources surveyed for the calendar.
sources:
  - id: gst-portal-impdts
    name: GST portal upcoming due dates (impdts JSON)
    publisher: GSTN
    url: https://www.gst.gov.in/fomessage/impdts
    category: due-dates
    format:
      - JSON
    access: open
    license: Unknown - GoI website, no open licence stated
    updates: monthly (current return period)
    reachable:
      status: 200
      checked: 2026-10-14
      note: GET 200; application/json; 269 B transferred; JSON object keys data. Endpoint found in static.gst.gov.in landing1.2.js (also /fomessage/msgtckr for the ticker). Returned 12 entries for the Sep 2026 and Jul-Sep 2026 periods, e.g. GSTR-3B (Sep, 2026) Oct 20th, 2026.
    machineReadable: true
    useInCalendar: Current-period due dates shown on the GST portal home page for GSTR-1 (monthly and QRMP), GSTR-3B (monthly and the two QRMP state groups), GSTR-5/5A/6/7/8, CMP-08 and IFF - the quickest signal that a GST date was extended.
    ingestion: "GET daily. Response is {\"data\": \"<JSON array encoded as a string>\"}, so decode twice; entries {f: form and period, d: date text such as 'Oct 22nd, 24th, 2026', t: type, q: QRMP flag}. Parse ordinal dates (two dates mean the two QRMP state groups) and compare with our GST rule output; open an issue on mismatch."
    priority: P0
  - id: it-efiling-tax-calendar-api
    name: e-Filing portal tax calendar API (full financial year)
    publisher: Income Tax Department (CBDT) - e-Filing portal
    url: https://eportal.incometax.gov.in/iec/returnservicesapi/getEntity
    category: due-dates
    format:
      - JSON
      - API
    access: open
    license: Unknown - GoI website, no open licence stated (due dates are statutory facts; attribute source)
    updates: on publication; current FY only (FY 2027-28 not yet published)
    reachable:
      status: 200
      checked: 2026-10-14
      note: POST 200; application/json; 27 KB transferred; JSON list of 353. Endpoint found in the e-Filing Angular bundle. POST with dueYear 2026 returned 353 items covering Apr 2026 - Mar 2027; dueYear 2027 returned an empty list. The home-page widget endpoint /iec/foportal/tax-calendar/ajax?month=M&year=Y also returned 200 JSON (12-73 items per sampled month from Apr 2026 to Mar 2027, empty from Apr 2027 and without parameters). OpenSSL chain check ok.
    machineReadable: true
    useInCalendar: Authoritative list of income-tax, TDS/TCS deposit and return, advance tax, STT/CTT and statutory form due dates for the current FY, with form codes, category and the applicable Act (Income-tax Act 1961 vs 2025). Primary cross-check and override signal for every income-tax rule.
    ingestion: 'POST JSON {"serviceName":"taxCalendarServiceImpl","dueYear":2026,"pan":""} (dueYear = FY start year) with Content-Type application/json. Response is a list of about 350 objects: dueDate (epoch ms at IST midnight), dueDay/dueMonth/dueYear, dueDescription, dueCategory, formCd, dueDateDesc, applicableAct. Poll weekly (daily near deadlines), diff against rule expansion and open an issue on any mismatch. Per-month fallback: GET https://www.incometax.gov.in/iec/foportal/tax-calendar/ajax?month=11&year=2026 (same object shape).'
    priority: P0
    used: true
    usedFor: Cross-check of every income-tax occurrence against the official tax calendar.
  - id: state-pt-tn
    name: Greater Chennai Corporation - Profession Tax press release
    publisher: Revenue Department, Greater Chennai Corporation
    url: https://chennaicorporation.gov.in/gcc/pdf/PT_Press_Release.pdf
    category: due-dates
    format:
      - PDF
    access: open
    license: Unknown
    updates: half-yearly (reissued at a stable URL; current release dated 04-08-2026)
    reachable:
      status: 200
      checked: 2026-10-14
      note: "HTTP 200 application/pdf (1.0 MB) from Toronto; HTTP 200 from check-host Mumbai and Los Angeles. tlscheck: ok TLSv1.3. Text-extractable PDF ref R.D. PT C.No/3555/2026 dated 04-08-2026, citing s.117-C of the TN Urban Local Bodies Act 1998 and Rule 277(2)/(3) of the TN Urban Local Bodies Rules 2023: employers deduct PT from the August and January pay bills, and the August 2026 deduction is remitted by 30 September 2026 with the Form 14 return; half-yearly slab table (nil up to Rs 21,000 half-yearly income, then Rs 180 / 425 / 930 / 1,025 / 1,250 w.e.f. II/2024-25). Linked from the GCC home page; online payment via erp.chennaicorporation.gov.in. No RSS."
    machineReadable: false
    useInCalendar: Tamil Nadu PT half-yearly deduction months, the first-half remittance deadline, slab table and Rule 277 citation; second-half deadline to be confirmed from the Rules.
    ingestion: "Automatable: fetch the stable PDF URL monthly, hash it, run pdftotext on change and flag for review. Rates are statewide; other urban local bodies collect in their own areas."
