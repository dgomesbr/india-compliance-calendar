      - API
      - PDF
    access: open
    license: Gazette text reusable (Copyright Act 1957 s.52(1)(q)); archive.org terms apply
    updates: daily
    reachable:
      status: 200
      checked: 2026-10-14
      note: "GET 200; application/json; 7 KB transferred; JSON object keys responseHeader,response. Collection holds 866,903 items (212,641 central); newest central items dated 2026-10-10 and uploaded the same day; newest state items 2026-10-12 (Gujarat). Metadata API 200 with OCR details. Scraper source code: github.com/sushant354/egazette."
    machineReadable: true
    useInCalendar: Machine-friendly mirror of central and state gazettes with OCR text and ministry/department metadata - the most reliable way for an overseas runner to watch new CBDT, CBIC, MCA and Labour notifications.
