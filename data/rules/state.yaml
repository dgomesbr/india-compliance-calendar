# state obligations. See docs/DATA_MODEL.md for the schema.
# Every rule cites its sources; edit with care and keep prose ASCII.
rules:
  - id: state-lwf-ap
    title: Andhra Pradesh LWF annual contribution
    form: Form F
    category: state
    authority: Andhra Pradesh Labour Welfare Board
    summary: Annual contribution of Rs 30 per employee (employee share) and Rs 70 per employee (employer share) for employees on the register as of 31 December, paid to the Welfare Commissioner with a Form F statement by 31 January of the next year.
    applicability: Factories (including places notified under s.85 Factories Act), motor transport undertakings, and shops or establishments (including societies and trusts) employing 20 or more persons on any day in the preceding 12 months; Government establishments other than factories are excluded.
    audience:
      - employer
      - company
      - llp
      - firm
    frequency: annual
    schedule:
      kind: annual
      basis: calendar
      day: 31
      monthOffset: 1
    law: Section 10(1), Andhra Pradesh Labour Welfare Fund Act 1987 (rates substituted by AP Act 7 of 2015, in force 23 Apr 2015); Rule 6, Andhra Pradesh Labour Welfare Fund Rules 1988
    penalty: No specific late-payment interest on contributions in the Act (S.9 penal interest of 1 percent then 1.5 percent per month covers unpaid accumulations and fines); after a 15-day demand notice under Rule 8 dues are recoverable as arrears of land revenue (S.24); records offences under S.25, with compounding under S.30-A.
    exposure:
      other:
        - Rule 8 demand notice - pay within 15 days
        - Recoverable as arrears of land revenue (S.24)
        - Fine up to Rs 500 or 3 months imprisonment for obstruction or non-production of records (S.25); compoundable (S.30-A)
      basis: AP LWF Act 1987 S.24 land-revenue recovery after a Rule 8 notice; S.9 interest covers unpaid accumulations and fines only.
    states:
      - AP
    sources:
      - title: India Code - Andhra Pradesh Labour Welfare Fund Act 1987 (as amended by Act 7 of 2015)
        url: https://indiacode.gov.in/server/api/core/bitstreams/2d3f5af9-1af6-438f-aaf7-c09b3ea839e2/content
        kind: act
      - title: AP Labour Department - A.P. Labour Welfare Fund Rules 1988 (archived copy, Rule 6)
        url: https://web.archive.org/web/20180508131138id_/http://labour.ap.gov.in:80/documents/APLabourWelfareFundRules1988.pdf
        kind: rules
      - title: AP Gazette No. 120, 23 Apr 2015 - commencement of AP LWF (Amendment) Act 2015 (G.O. Ms. No. 7)
        url: https://web.archive.org/web/20151227232302id_/http://labour.ap.gov.in:80/documents/Notification_of_commencing_date_for_APLWF_Amendment_2015.pdf
        kind: notification
    verified: 2026-10-14
    confidence: medium
    notes: Rates Rs 30 / Rs 70 per year since 23 Apr 2015; the Act lets the Government revise them by notification, and no later notification was found, but labour.ap.gov.in was unreachable so a current official rate page could not be checked (one 2026 commercial table shows Rs 31 / Rs 69, which could not be corroborated). Not affected by the four Labour Codes (state welfare-fund Act; no notification folding LWF into the Codes was found).
    code: LWF AP
  - id: state-lwf-cg
    title: Chhattisgarh LWF half-yearly contribution
    category: state
    authority: Chhattisgarh Shram Kalyan Mandal (Labour Welfare Board)
    summary: "Half-yearly contribution collected in January and July: Rs 15 per worker employee share and Rs 45 per worker employer share, with a minimum employer contribution of Rs 1500; payable by 15 January and 15 July."
    applicability: Factories and establishments with more than 9 workers (10 or more); managerial staff excluded.
    audience:
      - employer
      - company
      - llp
      - firm
    frequency: half-yearly
    schedule:
      kind: half-yearly
      basis: calendar
      day: 15
      monthOffset: 1
    law: Section 9, Chhattisgarh Shram Kalyan Nidhi Adhiniyam 1982 (MP Act of 1982 as adapted for Chhattisgarh) and rules made under it
    penalty: Not verified for Chhattisgarh; the parent 1982 Act (as applied in MP) makes default punishable under S.31(2).
    exposure:
      other:
        - Penalty and interest provisions not verified for Chhattisgarh
      basis: Not verified; see S.31 of the 1982 Adhiniyam.
    states:
      - CG
    sources:
      - title: Chhattisgarh Labour Department - Shram Kalyan Mandal terms and contribution page (archived Sep 2024)
        url: https://web.archive.org/web/20240913210155id_/https://cglabour.nic.in/ShramKalyanMandal/abhidayrashi.aspx
        kind: portal
      - title: Zoho Payroll - Labour Welfare Fund state guide (Chhattisgarh Rs 15 / Rs 45 half-yearly, 15 July and 15 January)
        url: https://www.zoho.com/in/payroll/academy/taxes-and-compliance/guide-to-lwf.html
        kind: secondary
      - title: India Code - Chhattisgarh Shram Kalyan Nidhi Adhiniyam 1982 (Hindi)
        url: https://indiacode.gov.in/server/api/core/bitstreams/6b75fe86-ff8a-429f-87b7-0851c34b4572/content
        kind: act
    verified: 2026-10-14
    confidence: medium
    notes: Rates and the January/July collection come from the archived official Labour Department page (Sep 2024); the exact 15th-day deadline is taken from the parent 1982 Act as applied in MP and from payroll sources, because the Hindi Act text on India Code is not machine-readable and cglabour.nic.in was unreachable. MP raised its rates from January 2026; whether Chhattisgarh made a similar 2025-2026 change was not found. Not affected by the four Labour Codes (state welfare-fund Act; no notification folding LWF into the Codes was found).
    code: LWF CG
  - id: state-lwf-ch
    title: Chandigarh LWF contribution (half-yearly deposit)
    category: state
    authority: Labour Department, UT Chandigarh (Welfare Commissioner, Punjab LWF Act as extended)
    summary: Monthly contribution of Rs 5 per employee (employee share) and Rs 20 per employee (employer share) for each employee on the register on the last working day of the month, deposited before 15 October for April-September and before 15 April for October-March.
    applicability: Establishments in UT Chandigarh covered by the Punjab Labour Welfare Fund Act 1965 as in force there (factories, motor omnibus services and establishments employing more than 20 persons under the Punjab definition).
    audience:
      - employer
      - company
      - llp
      - firm
    frequency: half-yearly
    schedule:
      kind: half-yearly
      basis: fy
      day: 15
      monthOffset: 1
    law: Section 9-A, Punjab Labour Welfare Fund Act 1965 as extended to UT Chandigarh under s.87 Punjab Reorganisation Act 1966 (MHA notifications of 28 May 2009, G.S.R. 885(E) of 10 Dec 2012 and G.S.R. 353(E) of 10 Apr 2018)
    penalty: No late-payment interest clause; unpaid sums are recoverable as arrears of land revenue under S.20 of the Punjab Act as in force in Chandigarh.
    exposure:
      other:
        - Recoverable as arrears of land revenue (S.20)
        - No statutory interest rate for late contributions found
      basis: "Punjab LWF Act 1965 as extended to Chandigarh, S.20: recovery as arrears of land revenue."
    states:
      - CH
    sources:
      - title: MHA notification G.S.R. 353(E), 10 Apr 2018 - Punjab LWF (Amendment) Act 2014 extended to Chandigarh (Rs 5 / Rs 20)
        url: https://indiacode.gov.in/server/api/core/bitstreams/4763d595-3b9e-4dae-bd36-9b4c7350d511/content
        kind: notification
      - title: MHA notification of 28 May 2009 - Punjab LWF (Amendment) Act 2005 extended to Chandigarh (S.9-A, due 15 October and 15 April)
        url: https://indiacode.gov.in/server/api/core/bitstreams/adb47a99-ed4e-4466-8408-5c3e34c319cd/content
        kind: notification
      - title: MHA notification G.S.R. 885(E), 10 Dec 2012 - Punjab LWF (Second Amendment) Act 2010 extended to Chandigarh
        url: https://indiacode.gov.in/server/api/core/bitstreams/29b8cb54-ec65-44d9-b854-72ea95461521/content
        kind: notification
    verified: 2026-10-14
    confidence: high
    notes: Rates moved from Rs 1/2 (2009) to Rs 2/4 (2012) to Rs 5/20 (extension of Punjab Act 32 of 2014 on 10 Apr 2018); no 2024-2026 change found. Coverage threshold taken from the Punjab definition; a Chandigarh-specific consolidated text was not reviewed. Not affected by the four Labour Codes (state welfare-fund Act; no notification folding LWF into the Codes was found).
    code: LWF CH
  - id: state-lwf-dl
    title: Delhi LWF half-yearly contribution
    form: Form A
    category: state
    authority: Delhi Labour Welfare Board
    summary: For each employee on the register on 30 June and 31 December, 75 paise employee share and Rs 2.25 employer share per half-year, remitted to the Delhi Labour Welfare Board before 15 July and 15 January (Form A statement by 31 July and 31 January).
    applicability: Factories, tramway, motor omnibus or motor transport undertakings, and establishments under the Delhi Shops and Establishments Act 1954 that employed 5 or more persons in the preceding 12 months.
    audience:
      - employer
      - company
      - llp
      - firm
    frequency: half-yearly
    schedule:
      kind: half-yearly
      basis: calendar
      day: 15
      monthOffset: 1
    law: Section 6BB(2)-(3), Bombay Labour Welfare Fund Act 1953 as extended to Delhi (MHA notification of 15 Dec 1986); Rule 3(4), Delhi Labour Welfare Fund Rules 1997
    penalty: "S.6B: after a demand notice is not complied with, simple interest of 1 percent per completed month for the first three months after the due date and 1.5 percent per month thereafter."
    exposure:
      interestPctPerMonth: 1
      other:
        - Interest rises to 1.5 percent per month after the first three months
        - Only after a demand notice is ignored
      basis: "S.6B Bombay LWF Act 1953 as extended to Delhi: 1 then 1.5 percent per completed month after notice."
    states:
      - DL
    sources:
      - title: India Code - Bombay Labour Welfare Fund Act 1953 as extended to Delhi (MHA notification 15 Dec 1986)
        url: https://indiacode.gov.in/server/api/core/bitstreams/c1161426-1eec-4d63-8d89-dbcdf91dcd5a/content
        kind: act
      - title: India Code - Delhi Labour Welfare Fund Rules 1997
        url: https://indiacode.gov.in/server/api/core/bitstreams/0a67264b-6c86-4903-9948-f6d9c4d75de8/content
        kind: rules
      - title: Zoho Payroll - Labour Welfare Fund state guide (Delhi Rs 0.75 / Rs 2.25 half-yearly)
        url: https://www.zoho.com/in/payroll/academy/taxes-and-compliance/guide-to-lwf.html
        kind: secondary
    verified: 2026-10-14
    confidence: medium
    notes: The 1986 extension text and the 1997 Rules are primary, but labour.delhi.gov.in was unreachable so the current collection practice and any later rate change could not be confirmed; secondary sources still show 75 paise / Rs 2.25. Not affected by the four Labour Codes (state welfare-fund Act; no notification folding LWF into the Codes was found).
    code: LWF DL
  - id: state-lwf-ga
    title: Goa LWF half-yearly contribution
    form: Form A
    category: state
    authority: Goa Labour Welfare Board
    summary: "Contribution of Rs 10 per month employee share and Rs 30 per month employer share (Rs 60 and Rs 180 per half-year; government adds Rs 20 a month), remitted half-yearly: January-June by 31 July and July-December by 31 January."
    applicability: "Very broad coverage: factories, motor transport undertakings and services, shops and establishments, contractors' establishments, scheduled employments, plantations, ports and docks, and other listed establishments; employees with 30 days continuous service in 12 months, excluding managerial staff."
    audience:
      - employer
      - company
      - llp
      - firm
    frequency: half-yearly
    schedule:
      kind: half-yearly
      basis: calendar
      day: 31
      monthOffset: 1
    law: Section 14(1), Goa Labour Welfare Fund Act 1986 (amended till Feb 2026); Rule 4, Goa, Daman and Diu Labour Welfare Fund Rules 1990
    penalty: Unpaid sums are recoverable as arrears of land revenue (S.24). The S.13 penal interest (2 percent then 4.5 percent per month) is written for unpaid accumulations and amounts realised from employees; offences were converted to monetary penalties by the Goa Jan Vishwas (Laws Amendment) Act 2026 (for example up to Rs 25000, repeat Rs 50000, for ignoring Board directions).
    exposure:
      other:
        - Recoverable as arrears of land revenue (S.24)
        - S.13 interest of 2 percent then 4.5 percent per month applies to unpaid accumulations and amounts realised from employees
        - Monetary penalties up to Rs 25000 (Rs 50000 repeat) for non-compliance with Board directions (S.26, Goa Act 2 of 2026)
      basis: Goa LWF Act 1986 S.24 land-revenue recovery; S.13 interest and S.26 penalties as amended by Goa Act 2 of 2026.
    states:
      - GA
    sources:
      - title: Office of the Commissioner, Labour and Employment, Goa - Labour Welfare Board (rates and half-yearly due dates)
        url: https://labour.goa.gov.in/labour-welfare-board/
        kind: portal
      - title: India Code - Goa Labour Welfare Fund Act 1986 (amended till Feb 2026)
        url: https://indiacode.gov.in/server/api/core/bitstreams/026fcc74-96da-4184-b833-ade28c762673/content
        kind: act
      - title: India Code - Goa, Daman and Diu Labour Welfare Fund Act 1986 and Rules 1990 (Rule 4)
        url: https://indiacode.gov.in/server/api/core/bitstreams/7850df3d-4399-4f33-952d-a3b6b710d979/content
        kind: rules
    verified: 2026-10-14
    confidence: high
    notes: The Act states yearly amounts (Rs 120 employee, Rs 360 employer, Rs 240 government); the Board page expresses them as Rs 10 / Rs 30 / Rs 20 and collects half-yearly, so each half-year remittance is Rs 60 + Rs 180 per employee. No rate change in 2024-2026; the 2026 Jan Vishwas amendment changed penalties, not contributions. Not affected by the four Labour Codes (state welfare-fund Act; no notification folding LWF into the Codes was found).
    code: LWF GA
  - id: state-lwf-gj
    title: Gujarat LWF half-yearly contribution
    category: state
    authority: Gujarat Labour Welfare Board
    summary: Half-yearly contribution for every employee on the register in June and December (employee share deducted from June and December wages, employer pays twice the employee share), remitted to the Gujarat Labour Welfare Board before 15 July and 15 January; the notified rate generally applied is Rs 6 employee and Rs 12 employer per half-year.
    applicability: Factories, tramway or motor omnibus services, and shops or establishments that employed 10 or more persons in the preceding 12 months; managerial staff and supervisors drawing over Rs 3500 a month are excluded.
    audience:
      - employer
      - company
      - llp
      - firm
    frequency: half-yearly
    schedule:
      kind: half-yearly
      basis: calendar
      day: 15
      monthOffset: 1
    law: Section 6B(2)-(5), Gujarat Labour Welfare Fund Act 1953 (Bombay Act XL of 1953, as modified up to 31 Oct 2012); Gujarat Labour Welfare Fund Rules
    penalty: "S.6C: if dues are not paid within a demand notice period of at least 30 days, simple interest of 12 percent p.a. for the first three months after expiry of the notice and 18 percent p.a. thereafter, without prejudice to other penalties; the Welfare Commissioner may remit interest."
    exposure:
      interestPctPerAnnum: 12
      other:
        - Interest rises to 18 percent p.a. after the first three months
        - Runs from expiry of a demand notice of at least 30 days; may be remitted
      basis: "S.6C Gujarat LWF Act 1953: 12 then 18 percent p.a. simple interest after an unheeded demand notice."
    states:
      - GJ
    sources:
      - title: India Code - Gujarat Labour Welfare Fund Act 1953 (as modified up to 31 Oct 2012)
        url: https://indiacode.gov.in/server/api/core/bitstreams/9f8cbbf7-a09e-4728-b668-a4f1680320bd/content
        kind: act
      - title: Zoho Payroll - Labour Welfare Fund state guide (Gujarat Rs 6 / Rs 12 half-yearly, 15 July and 15 January)
        url: https://www.zoho.com/in/payroll/academy/taxes-and-compliance/guide-to-lwf.html
        kind: secondary
    verified: 2026-10-14
    confidence: medium
    notes: The Act sets a base of Rs 3 employee / Rs 6 employer per half-year and lets the State raise the employee rate up to Rs 6 by notification with the employer paying double; the Rs 6 / Rs 12 figure in use was confirmed only from secondary sources because glwb.gujarat.gov.in was unreachable. No 2024-2026 revision was found. Not affected by the four Labour Codes (state welfare-fund Act; no notification folding LWF into the Codes was found).
    code: LWF GJ
  - id: state-lwf-hr
    title: Haryana LWF contribution (yearly deposit)
    category: state
    authority: Haryana Labour Welfare Board
    summary: Each month the employee contributes 0.2 percent of wages subject to a CPI-indexed cap (Rs 31 when introduced in 2019; about Rs 35 reported for 2026) and the employer twice that; the employer must deposit both shares online for the year before 31 December.
    applicability: Factories and industrial premises, and shops or commercial establishments in which 10 or more employees are or were employed in the preceding 12 months; contribution is due for each employee on the register on the last working day of the month.
    audience:
      - employer
      - company
      - llp
      - firm
    frequency: annual
    schedule:
      kind: annual
      basis: calendar
      day: 31
      monthOffset: 0
    law: Section 9A(1)-(4), Punjab Labour Welfare Fund Act 1965 as applicable to Haryana (S.9A(1) substituted by Haryana Act 18 of 2019, 14 Mar 2019); Punjab Labour Welfare Fund Rules 1966 as applicable to Haryana
    penalty: "S.9A(4): if not paid within one month of the 31 December due date, interest at 12 percent p.a. from that date until payment. S.26A: contravention of the Act or rules - fine of Rs 2000 to Rs 5000 for a first offence; repeat offences up to 3 months imprisonment or a higher fine."
    exposure:
      fixedPenalty: 2000
      maxPenalty: 5000
      interestPctPerAnnum: 12
      other:
        - Interest starts if dues remain unpaid one month after the due date (S.9A(4))
        - "Repeat offences: imprisonment up to 3 months or a higher fine (S.26A)"
      basis: "S.9A(4) and S.26A Punjab LWF Act 1965 as applicable to Haryana: 12 percent p.a. interest; Rs 2000-5000 fine for a first offence."
    states:
      - HR
    sources:
      - title: India Code - Punjab Labour Welfare Fund Act 1965 as applicable to Haryana (amended up to 14 Mar 2019)
        url: https://indiacode.gov.in/server/api/core/bitstreams/15b68799-6485-4f81-bc14-22e5a195305d/content
        kind: act
      - title: HR Informative - Haryana LWF calculator 2026 (cap Rs 35 employee, Rs 70 employer)
        url: https://hrinformative.com/haryana-labour-welfare-fund-calculator/
        kind: secondary
    verified: 2026-10-14
    confidence: medium
    notes: The statute says the deposit is due 'before the 31st December of every year' (modelled as 31 December); payroll guides describe the deduction as monthly, but the statutory deposit deadline is the yearly one. The Rs 31 cap is indexed to the consumer price index every 1 January, so the cap for each year must be checked with the Board (hrylabour.gov.in was unreachable); the 2026 figure of Rs 35 / Rs 70 comes from a secondary source. Post-2019 amendments to S.9A could not be ruled out. Not affected by the four Labour Codes (state welfare-fund Act; no notification folding LWF into the Codes was found).
    code: LWF HR
  - id: state-lwf-ka
    title: Karnataka LWF annual contribution
    category: state
    authority: Karnataka Labour Welfare Board
    summary: "Annual contribution for every employee on the register on 31 December: Rs 50 employee share (deducted from December wages) plus Rs 100 employer share, paid online to the Karnataka Labour Welfare Board by 15 January of the next year."
    applicability: Factories, motor omnibus services, plantations and workshops, and any establishment (including societies and trusts) carrying on business that employed 10 or more persons on any day in the preceding 12 months (threshold cut from 50 to 10 with effect from 7 Jan 2026); Central and State Government establishments other than factories are excluded.
    audience:
      - employer
      - company
      - llp
      - firm
    frequency: annual
    schedule:
      kind: annual
      basis: calendar
      day: 15
      monthOffset: 1
    law: Section 7A(2)-(4), Karnataka Labour Welfare Fund Act 1965 (rates substituted by Karnataka Act 05 of 2025 w.e.f. 10 Jan 2025; online payment and 10-person threshold by Karnataka Act 05 of 2026 w.e.f. 7 Jan 2026); Karnataka Labour Welfare Fund Rules 1968
    penalty: "S.7B: after a demand notice (up to 30 days) is ignored, simple interest of 12 percent p.a. for the first three months and 18 percent p.a. thereafter; S.17 recovery as arrears of land revenue; S.17B wilful contravention - fine up to Rs 500 or up to 3 months imprisonment (repeat: up to Rs 1000 or 1 year); prosecution needs Welfare Commissioner sanction (S.17C)."
    exposure:
      maxPenalty: 500
      interestPctPerAnnum: 12
      other:
        - Interest rises to 18 percent p.a. after the first three months
        - Interest applies after a demand notice is not complied with
        - "Repeat contravention: fine up to Rs 1000 or imprisonment up to 1 year (S.17B)"
        - Recoverable as arrears of land revenue (S.17)
      basis: "S.7B and S.17B Karnataka LWF Act 1965: 12 then 18 percent p.a. interest after notice; fine up to Rs 500 for first wilful contravention."
    states:
      - KA
    sources:
      - title: India Code - Karnataka Labour Welfare Fund Act 1965, as amended by Acts 05 of 2025 and 05 of 2026
        url: https://indiacode.gov.in/server/api/core/bitstreams/f21912be-cf04-4bf9-b7d3-cb23f94d42ac/content
        kind: act
    verified: 2026-10-14
    confidence: high
    notes: "2025 change: Act 05 of 2025 (gazette 10 Jan 2025) raised the yearly rates from Rs 20 / Rs 40 / Rs 20 to Rs 50 employee, Rs 100 employer and Rs 50 State Government. Because it took effect on 10 Jan 2025 (after the 31 Dec 2024 register date) the rate used for calendar year 2024 (due 15 Jan 2025) was not confirmed; from calendar year 2025 the new rates apply. 2026 change: Act 05 of 2026 (gazette 7 Jan 2026) mandates online payment (net banking, NEFT, RTGS, UPI or demand draft) and extends coverage to establishments with 10 or more persons, so many smaller employers become liable from calendar year 2026 (first payment due 15 Jan 2027). Official Board and Labour Department sites (klwb.karnataka.gov.in) could not be reached from this machine; the consolidated Act on India Code was used. Not affected by the four Labour Codes (state welfare-fund Act; no notification folding LWF into the Codes was found)."
    code: LWF KA
  - id: state-lwf-kl
    title: Kerala Labour Welfare Fund half-yearly contribution
    category: state
    authority: Kerala Labour Welfare Fund Board
    summary: Rs 4 employee share and Rs 8 employer share per employee per half-year under the Kerala Labour Welfare Fund Act 1975, paid by the employer before 15 July and 15 January.
    applicability: Factories, motor transport undertakings, plantations (tea, rubber, coffee, cardamom, oil palm, cocoa) employing 10 or more persons, and shops or commercial establishments covered by the Act; employees with at least 30 days of service in the preceding 12 months, excluding managerial staff, apprentices and part-timers.
    audience:
      - employer
      - company
      - llp
      - firm
    frequency: half-yearly
    schedule:
      kind: half-yearly
      basis: calendar
      day: 15
      monthOffset: 1
    law: Section 15, Kerala Labour Welfare Fund Act 1975 (Act 11 of 1977); Kerala Labour Welfare Fund Rules
    penalty: "S.14: if contributions are not paid within a demand notice period of at least 30 days, penal simple interest at 9 percent p.a. from the date the amount fell due; the Government may remit it."
    exposure:
      interestPctPerAnnum: 9
      other:
        - Counted from the original due date once a demand notice of at least 30 days is ignored
        - May be remitted by Government
      basis: "S.14 Kerala LWF Act 1975: 9 percent p.a. simple interest after an unheeded demand notice."
    states:
      - KL
    sources:
      - title: India Code - Kerala Labour Welfare Fund Act 1975 (Act 11 of 1977)
        url: https://indiacode.gov.in/server/api/core/bitstreams/48840e17-c54c-4065-a42f-79dfaf16d769/content
        kind: act
    verified: 2026-10-14
    confidence: medium
    notes: Kerala also runs separate monthly welfare funds (for example the Kerala Shops and Commercial Establishments Workers Welfare Fund) that are not covered by this rule. The India Code copy is undated and the Board site was unreachable, so the Rs 4 / Rs 8 rate could not be checked against a current official page (a 2026 secondary table shows the same figures). Not affected by the four Labour Codes (state welfare-fund Act; no notification folding LWF into the Codes was found).
    code: LWF KL
  - id: state-lwf-mh
    title: Maharashtra LWF contribution (June and December)
    form: Form A-1
    category: state
    authority: Maharashtra Labour Welfare Board
    summary: Employer deducts the employee share from the June and December wages, adds the employer share (currently Rs 25 employee + Rs 75 employer per employee per half-year) and remits both to the Maharashtra Labour Welfare Board by 15 July and 15 January.
    applicability: Factories, motor transport undertakings and shops or establishments that employed 5 or more persons on any day in the preceding 12 months; contribution is due for every employee on the register on 30 June and 31 December (managerial staff, supervisors drawing over Rs 3500 a month and apprentices are excluded).
    audience:
      - employer
      - company
      - llp
      - firm
    frequency: half-yearly
    schedule:
      kind: half-yearly
      basis: calendar
      day: 15
      monthOffset: 1
    law: Section 6BB(2)-(4), Maharashtra Labour Welfare Fund Act 1953 (S.6BB(2) substituted by Mah. Act XXV of 2024, MGG 18 Mar 2024); Rule 3-A, Maharashtra Labour Welfare Fund Rules 1953 (Form A-1 statement by 31 July / 31 January)
    penalty: "S.6B: if a demand notice (at least 30 days) is not complied with, simple interest of 1.5 percent of the dues for each completed month for the first three months after the 15 July / 15 January due date and 2 percent per month thereafter; the Welfare Commissioner may remit it. Dues are recoverable as arrears of land revenue (S.17); obstructing inspection or not producing records attracts a fine up to Rs 1 lakh (Rs 2 lakh for repeat) under S.17-A."
    exposure:
      interestPctPerMonth: 1.5
      other:
        - Interest rises to 2 percent per completed month after the first three months
        - Interest applies only after a demand notice of at least 30 days is ignored; may be remitted
        - Recoverable as arrears of land revenue (S.17)
        - Fine up to Rs 100000 (Rs 200000 repeat) for obstructing inspection or not producing records (S.17-A)
      basis: "S.6B Maharashtra LWF Act 1953: 1.5 percent per completed month for 3 months then 2 percent, after an unheeded demand notice."
    states:
      - MH
    sources:
      - title: Maharashtra Labour Welfare Board - LWF Act 1953 and Rules (English, updated with 2024 amendment)
        url: https://mlwb.in/react-static-files/pdf/homepage/Quick-Links/MLWB-Fund-Act-and-Rules-english-version.pdf
        kind: act
      - title: Maharashtra Government Gazette 18 Mar 2024 - LWF (Amendment) Act 2024 substituting Section 6BB(2)
        url: https://mlwb.in/react-static-files/pdf/homepage/Quick-Links/Notification-6BB.pdf
        kind: notification
      - title: Maharashtra Labour Welfare Board - official website, Labours' Welfare Fund page (revised rates from June 2024)
        url: https://www.mlwb.in/
        kind: portal
