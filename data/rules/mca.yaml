# mca obligations. See docs/DATA_MODEL.md for the schema.
# Every rule cites its sources; edit with care and keep prose ASCII.
rules:
  - id: mca-adt1-annual
    title: ADT-1 auditor appointment notice
    form: ADT-1
    category: mca
    authority: MCA / Registrar of Companies
    summary: Notify the Registrar of the appointment or re-appointment of the statutory auditor within 15 days of the meeting at which the auditor was appointed.
    applicability: Companies that appoint or re-appoint a statutory auditor at the AGM (normally once every five years for a five-year term, plus casual vacancies and first auditors). In years with no appointment there is nothing to file.
    audience:
      - company
      - listed
      - audit
    frequency: annual
    schedule:
      kind: annual
      basis: fy
      day: 14
      monthOffset: 7
      entityYear: true
      follows:
        rule: mca-agm-annual
        within:
          days: 14
    law: Section 139(1) fourth proviso, Companies Act 2013; Rule 4(2), Companies (Audit and Auditors) Rules 2014 (V3 form by G.S.R. 359(E))
    penalty: "Additional fee under Table B: 1x the normal fee if up to 15 days late, then 2x up to 30 days, 4x up to 60 days, 6x up to 90 days, 10x up to 180 days and 12x beyond. Section 147(1): the company is punishable with a fine of Rs 25,000 to Rs 5 lakh and officers Rs 10,000 to Rs 1 lakh."
    exposure:
      fixedPenalty: 25000
      maxPenalty: 500000
      other:
        - Table B additional fee 1x-12x of normal fee by length of delay
      basis: "Section 147(1): company fine Rs 25,000 to Rs 5 lakh for contravention of Sections 139-146"
    sources:
      - title: MCA e-book - Companies Act 2013, Section 139 (appointment of auditors)
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=Mjc5Nzk=&docCategory=Acts&type=open
        kind: act
      - title: MCA e-book - Companies (Audit and Auditors) Rules 2014, Rule 4
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=MzE0Nzk=&docCategory=Rules&type=open
        kind: rules
      - title: MCA - G.S.R. 359(E) dated 30-05-2025, Companies (Audit and Auditors) Amendment Rules 2025
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=NTQwNjEyMjgw&docCategory=Notifications&type=open
        kind: notification
      - title: MCA e-book - Companies Act 2013, Section 147 (punishment for contravention)
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=MjgwNzQ=&docCategory=Acts&type=open
        kind: act
      - title: MCA e-book - Companies (Registration Offices and Fees) Rules 2014, Rule 12 and Table of Fees
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=MzE1NDU=&docCategory=Rules&type=open
        kind: rules
    verified: 2026-10-14
    confidence: high
    notes: "Runs from the meeting that appoints the auditor, normally the AGM: 14 days after the date recorded for it, or after the AGM's last permitted day (30 September for an April-March year) until one is recorded. With no meeting there is no appointment and nothing to file. The 14 October date counts the AGM day as day 1 (the conservative reading used by most calendars); counting from the day after the AGM gives 15 October."
    code: ADT-1
  - id: mca-adt3-event
    title: ADT-3 statement on auditor resignation
    form: ADT-3
    category: mca
    authority: MCA / Registrar of Companies
    summary: A resigning statutory auditor files a statement of reasons with the company and the Registrar (and with the CAG for Government companies).
    applicability: Statutory auditors who resign from a company; the company then fills the casual vacancy and files ADT-1.
    audience:
      - audit
      - company
    frequency: event
    trigger: Within 30 days of the date of resignation
    law: Section 140(2)-(3), Companies Act 2013; Rule 8, Companies (Audit and Auditors) Rules 2014 (V3 form by G.S.R. 359(E))
    penalty: "Section 140(3): the auditor is liable to a penalty of Rs 50,000 or the auditor's remuneration, whichever is less, plus Rs 500 per day of continuing failure, up to Rs 2 lakh."
    exposure:
      lateFeePerDay: 500
      lateFeeCap: 200000
      fixedPenalty: 50000
      maxPenalty: 200000
      other:
        - Penalty falls on the auditor, not the company
      basis: "Section 140(3): Rs 50,000 (or remuneration if lower) plus Rs 500/day up to Rs 2 lakh"
    sources:
      - title: MCA e-book - Companies Act 2013, Section 140 (resignation of auditor)
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=Mjc5ODA=&docCategory=Acts&type=open
        kind: act
      - title: MCA e-book - Companies (Audit and Auditors) Rules 2014, Rule 8
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=Mjk3MDQ=&docCategory=Rules&type=open
        kind: rules
      - title: MCA - G.S.R. 359(E) dated 30-05-2025, Companies (Audit and Auditors) Amendment Rules 2025
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=NTQwNjEyMjgw&docCategory=Notifications&type=open
        kind: notification
    verified: 2026-10-14
    confidence: high
    code: ADT-3
  - id: mca-agm-annual
    title: Annual general meeting (AGM) deadline
    category: mca
    authority: MCA / Registrar of Companies
    summary: Hold the annual general meeting that adopts the audited financial statements for the year. AOC-4, MGT-7, ADT-1 and MGT-15 deadlines run from this meeting.
    applicability: Every company other than a One Person Company. First AGM within 9 months of the end of the first financial year; later AGMs within 6 months of the year end (30 September for a 31 March year end), with no more than 15 months between two AGMs. The ROC may extend a later AGM by up to 3 months on an application in Form GNL-1.
    audience:
      - company
      - listed
    frequency: annual
    schedule:
      kind: annual
      basis: fy
      day: 30
      monthOffset: 6
      entityYear: true
      after:
        months: 6
    law: Section 96(1), Companies Act 2013; Section 99 (punishment); Section 101(1) (21 clear days' notice)
    penalty: "Section 99: the company and every officer in default are punishable with a fine of up to Rs 1 lakh and, for a continuing default, up to Rs 5,000 for every day the default continues (court-imposed fine)."
    exposure:
      lateFeePerDay: 5000
      maxPenalty: 100000
      other:
        - Court-imposed fine on prosecution, not an adjudicated penalty
        - Tribunal can order the meeting on a member's application (Section 97)
      basis: "Section 99: fine up to Rs 1 lakh plus up to Rs 5,000 per day of continuing default; no overall cap on the daily amount"
    sources:
      - title: MCA e-book - Companies Act 2013, Section 96 (annual general meeting)
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=MjgwNTU=&docCategory=Acts&type=open
        kind: act
      - title: MCA e-book - Companies Act 2013, Section 99 (punishment for AGM default)
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=MjQ2Nzc=&docCategory=Acts&type=open
        kind: act
      - title: MCA e-book - Companies Act 2013, Section 101 (notice of meeting)
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=NjU5MzIxMTQ4&docCategory=Acts&type=open
        kind: act
      - title: MCA - General Circular No. 03/2025 dated 22-09-2025 (AGM/EGM through VC or OAVM till further orders)
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=Njg4NzA0Mjkx&docCategory=Circulars&type=open
        kind: circular
    verified: 2026-10-14
    confidence: high
    notes: "General Circular 03/2025 (22-09-2025) lets companies hold AGMs and EGMs through video conference till further orders but expressly grants no extension of the AGM deadline. No AGM extension has been notified for FY 2025-26. The top 100 listed entities must hold their AGM within 5 months (see sebi-agm-top100-annual). Record the date the AGM was held: AOC-4, MGT-7 or MGT-7A, ADT-1, MGT-15, CSR-2 and the SEBI annual report then run from it, and until then from the last permitted day. A company allowed another financial year (section 2(41) proviso) counts the six months from the end of that year."
    code: AGM
    tags:
      - not-opc
    recordAs: held
  - id: mca-aoc4-annual
    title: AOC-4 / AOC-4 XBRL / AOC-4 CFS financial statements
    form: AOC-4, AOC-4 XBRL, AOC-4 CFS, AOC-4 NBFC (Ind AS), AOC-4 CFS NBFC (Ind AS)
    category: mca
    authority: MCA / Registrar of Companies
    summary: File the adopted standalone financial statements (and consolidated statements, if any) with the Board's report and auditor's report. Since 14-07-2025 the V3 forms also need the linked e-forms Extract of Board Report and Extract of Auditor's Report.
    applicability: Every company other than a One Person Company (see mca-aoc4-opc-annual). XBRL mode for listed companies and their Indian subsidiaries, companies with paid-up capital of Rs 5 crore or more or turnover of Rs 100 crore or more, and Ind AS companies (banking, insurance, NBFC and housing finance companies excluded). Ind AS NBFCs use AOC-4 NBFC (Ind AS). Companies preparing consolidated statements also file AOC-4 CFS (or the consolidated XBRL / NBFC variant).
    audience:
      - company
      - listed
    frequency: annual
    schedule:
      kind: annual
      basis: fy
      day: 30
      monthOffset: 7
      entityYear: true
      follows:
        rule: mca-agm-annual
        within:
          days: 30
    law: Section 137(1)-(3), Companies Act 2013; Rule 12(1), (1A) and (1C), Companies (Accounts) Rules 2014; Rule 3, Companies (Filing of Documents and Forms in XBRL) Rules 2015; Table D, Companies (Registration Offices and Fees) Rules 2014
    penalty: "Additional fee of Rs 100 per day of delay with no upper limit (Table D, Fees Rules). Section 137(3): the company is liable to a penalty of Rs 10,000 plus Rs 100 per day of continuing failure, up to Rs 2 lakh; the MD and CFO (or responsible directors) Rs 10,000 plus Rs 100 per day, up to Rs 50,000 each. Directors of a company that has not filed financial statements or annual returns for three continuous years are disqualified for five years (Section 164(2)(a))."
    exposure:
      lateFeePerDay: 100
      fixedPenalty: 10000
      maxPenalty: 200000
      other:
        - Rs 100/day MCA additional fee has no cap
        - Officer penalty Rs 10,000 + Rs 100/day up to Rs 50,000
        - Director disqualification after 3 years of non-filing (Section 164(2)(a))
      basis: "Table D Fees Rules: Rs 100/day additional fee; Section 137(3): Rs 10,000 plus Rs 100/day up to Rs 2 lakh for the company"
    overrides:
      - period: FY2024-25
        due: 2025-12-31
        originalDue: 2025-10-30
        reason: MCA General Circular No. 06/2025 dated 17-10-2025 allowed the FY 2024-25 AOC-4 filings (AOC-4, CFS, NBFC and XBRL) to be filed without additional fees up to 31-12-2025. General Circular No. 08/2025 dated 30-12-2025 is reported to extend this to 31-01-2026; it could not be read here, so the confirmed date is shown.
        source:
          title: MCA General Circular No. 06/2025 dated 17-10-2025
          url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=NTc5MDY1MjQ0&docCategory=Circulars&type=open
    sources:
      - title: MCA e-book - Companies Act 2013, Section 137 (filing of financial statements)
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=MjgwNzI=&docCategory=Acts&type=open
        kind: act
      - title: MCA e-book - Companies (Accounts) Rules 2014, Rule 12
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=NTM5NDE5NTA0&docCategory=Rules&type=open
        kind: rules
      - title: MCA e-book - Companies (Filing of Documents and Forms in XBRL) Rules 2015, Rule 3
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=MzMzMDE=&docCategory=Rules&type=open
        kind: rules
      - title: MCA e-book - Companies (Registration Offices and Fees) Rules 2014, Rule 12 and Table of Fees
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=MzE1NDU=&docCategory=Rules&type=open
        kind: rules
      - title: MCA - G.S.R. 357(E) dated 30-05-2025, Companies (Accounts) Second Amendment Rules 2025
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=NTQwOTQ3NDc4&docCategory=Notifications&type=open
        kind: notification
      - title: MCA e-book - Companies Act 2013, Section 164 (disqualification of directors)
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=Mjc5NTk=&docCategory=Acts&type=open
        kind: act
      - title: MCA - General Circular No. 06/2025 dated 17-10-2025 (FY 2024-25 annual filings without additional fee till 31-12-2025)
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=NTc5MDY1MjQ0&docCategory=Circulars&type=open
        kind: circular
      - title: MCA - General Circular No. 08/2025 dated 30-12-2025 (FY 2024-25 annual filings without additional fee till 31-01-2026)
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=NjExNDE5MzU5&docCategory=Circulars&type=open
        kind: circular
      - title: MCA - General Circular No. 01/2026 dated 24-02-2026 (Companies Compliance Facilitation Scheme 2026)
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=NjM4NTY0NzE1&docCategory=Circulars&type=open
        kind: circular
    verified: 2026-10-14
    confidence: high
    notes: "Runs from the AGM: 30 days after the date recorded for it, or after its last permitted day (30 September for an April-March year) until one is recorded, which is also the rule when no AGM was held. Unadopted statements must still be filed within 30 days of the AGM and the adopted ones within 30 days of the adjourned AGM. Producer companies are reported to have 60 days (Section 378ZA) - not verified here. FY 2024-25 relief: no additional fee till 31-12-2025 (GC 06/2025, recorded as the extension); GC 08/2025 reportedly moved it to 31-01-2026, which could not be confirmed against the circular. CCFS-2026 (GC 01/2026, 15-04-2026 to 15-09-2026 after GC 03/2026 and 04/2026) let defaulting companies file old AOC-4/MGT-7 with only 10% of the additional fee. No relaxation for FY 2025-26 filings has been notified as of 14-10-2026."
    code: AOC-4
    tags:
      - not-opc
  - id: mca-aoc4-opc-annual
    title: AOC-4 for One Person Company (180 days)
    form: AOC-4 / AOC-4 XBRL
    category: mca
    authority: MCA / Registrar of Companies
    summary: A One Person Company files its financial statements, as adopted by its member, with the Registrar within 180 days of the end of the financial year.
    applicability: One Person Companies (no AGM is required).
    audience:
      - company
    frequency: annual
    schedule:
      kind: annual
      basis: fy
      daysAfter: 180
      entityYear: true
    law: Section 137(1), fourth proviso, Companies Act 2013; Rule 12, Companies (Accounts) Rules 2014; Table D, Companies (Registration Offices and Fees) Rules 2014
    penalty: "Additional fee of Rs 100 per day of delay with no upper limit (Table D). Section 137(3): Rs 10,000 plus Rs 100 per day, up to Rs 2 lakh for the company and Rs 50,000 for responsible officers."
    exposure:
      lateFeePerDay: 100
      fixedPenalty: 10000
      maxPenalty: 200000
      other:
        - Rs 100/day MCA additional fee has no cap
      basis: "Table D Fees Rules: Rs 100/day; Section 137(3): Rs 10,000 plus Rs 100/day up to Rs 2 lakh"
    overrides:
      - period: FY2024-25
        due: 2025-12-31
        originalDue: 2025-09-27
        reason: MCA General Circular No. 06/2025 dated 17-10-2025 allowed the FY 2024-25 AOC-4 (the form One Person Companies file) to be filed without additional fees up to 31-12-2025. General Circular No. 08/2025 dated 30-12-2025 is reported to extend this to 31-01-2026; it could not be read here, so the confirmed date is shown.
        source:
          title: MCA General Circular No. 06/2025 dated 17-10-2025
          url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=NTc5MDY1MjQ0&docCategory=Circulars&type=open
    sources:
      - title: MCA e-book - Companies Act 2013, Section 137 (filing of financial statements)
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=MjgwNzI=&docCategory=Acts&type=open
        kind: act
      - title: MCA e-book - Companies (Accounts) Rules 2014, Rule 12
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=NTM5NDE5NTA0&docCategory=Rules&type=open
        kind: rules
      - title: MCA e-book - Companies (Registration Offices and Fees) Rules 2014, Rule 12 and Table of Fees
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=MzE1NDU=&docCategory=Rules&type=open
        kind: rules
    verified: 2026-10-14
    confidence: high
    notes: 180 days from 31 March is 27 September.
    code: AOC-4 OPC
    tags:
      - opc
  - id: mca-ben2-event
    title: BEN-2 return of significant beneficial owners
    form: BEN-2
    category: mca
    authority: MCA / Registrar of Companies
    summary: File the return of significant beneficial owners with the Registrar after receiving a BEN-1 declaration from an SBO.
    applicability: Every company (reporting company) that receives a declaration of significant beneficial ownership or a change in it.
    audience:
      - company
      - foreign
    frequency: event
    trigger: Within 30 days of receipt of the BEN-1 declaration
    law: Section 90(4) and (11), Companies Act 2013; Rule 4, Companies (Significant Beneficial Owners) Rules 2018
    penalty: "Section 90(11): the company is liable to Rs 1 lakh plus Rs 500 per day after the first of continuing failure, up to Rs 5 lakh; officers Rs 25,000 plus Rs 200 per day, up to Rs 1 lakh. Table B additional fees apply to late filing."
    exposure:
      lateFeePerDay: 500
      lateFeeCap: 500000
      fixedPenalty: 100000
      maxPenalty: 500000
      other:
        - "Additional fee for late filing: 2x the normal fee up to 30 days late, 4x up to 60 days, 6x up to 90 days, 10x up to 180 days, 12x beyond (Table B, Fees Rules)"
      basis: "Section 90(11): Rs 1 lakh plus Rs 500/day up to Rs 5 lakh (company)"
    sources:
      - title: MCA e-book - Companies (Significant Beneficial Owners) Rules 2018, Rule 4
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=NDYwOTE1NTU4&docCategory=Rules&type=open
        kind: rules
      - title: MCA e-book - Companies Act 2013, Section 90 (register of significant beneficial owners)
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=MjgwNTE=&docCategory=Acts&type=open
        kind: act
    verified: 2026-10-14
    confidence: high
    code: BEN-2
  - id: mca-chg1-event
    title: CHG-1 registration of charge
    form: CHG-1 (CHG-9 for debentures)
    category: mca
    authority: MCA / Registrar of Companies
    summary: Register the creation or modification of a charge on the company's assets, signed by the company and the charge holder.
    applicability: Every company that creates or modifies a charge (except charges exempted in consultation with RBI).
    audience:
      - company
    frequency: event
    trigger: Within 30 days of creation or modification of the charge; the ROC may allow a further 30 days (up to day 60) with additional fee and then a further 60 days with ad valorem fee
    law: Section 77(1) and (3), Section 86(1), Companies Act 2013; Rule 3, Companies (Registration of Charges) Rules 2014; Table E, Fees Rules
    penalty: "Section 86(1): the company is liable to a penalty of Rs 5 lakh and each officer in default Rs 50,000. Late registration within the extended periods needs additional fee (multiples of the normal fee) or ad valorem fee. An unregistered charge is not taken into account by a liquidator or other creditors (Section 77(3))."
    exposure:
      fixedPenalty: 500000
      maxPenalty: 500000
      other:
        - Additional or ad valorem fee for days 31-120 (Table E)
        - Unregistered charge void against liquidator and creditors
      basis: "Section 86(1): Rs 5 lakh on the company"
    sources:
      - title: MCA e-book - Companies Act 2013, Section 77 (duty to register charges)
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=MjgwNDI=&docCategory=Acts&type=open
        kind: act
      - title: MCA e-book - Companies Act 2013, Section 86 (punishment for contravention - charges)
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=MjgwNDU=&docCategory=Acts&type=open
        kind: act
      - title: MCA e-book - Companies (Registration of Charges) Rules 2014, Rule 3
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=MzE0NDM=&docCategory=Rules&type=open
        kind: rules
      - title: MCA e-book - Companies (Registration Offices and Fees) Rules 2014, Rule 12 and Table of Fees
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=MzE1NDU=&docCategory=Rules&type=open
        kind: rules
    verified: 2026-10-14
    confidence: high
    notes: The pending Corporate Laws (Amendment) Bill 2026 proposes a longer further window for prescribed classes of companies; not law as of 14-10-2026.
    code: CHG-1
  - id: mca-cra2-annual
    title: CRA-2 cost auditor appointment
    form: CRA-2
    category: mca
    authority: MCA (Cost Audit Branch)
    summary: Appoint the cost auditor within 180 days of the start of the financial year and file CRA-2 within 30 days of the Board meeting that appointed them, or within 180 days of the start of the year, whichever is earlier.
    applicability: Companies required to have their cost records audited under the Companies (Cost Records and Audit) Rules 2014 (by sector and turnover thresholds).
    audience:
      - company
      - audit
    frequency: annual
    schedule:
      kind: annual
      basis: fy
      daysAfter: 180
      entityYear: true
    law: Rule 6(1), (2) and (3A), Companies (Cost Records and Audit) Rules 2014 (V3 form by G.S.R. 361(E)); Section 148(3) and (8), Companies Act 2013
    penalty: "Table B additional fee. Section 148(8)(a) read with Section 147(1): the company is punishable with a fine of Rs 25,000 to Rs 5 lakh and officers Rs 10,000 to Rs 1 lakh."
    exposure:
      fixedPenalty: 25000
      maxPenalty: 500000
      other:
        - "Additional fee for late filing: 2x the normal fee up to 30 days late, 4x up to 60 days, 6x up to 90 days, 10x up to 180 days, 12x beyond (Table B, Fees Rules)"
      basis: "Section 148(8)(a) read with Section 147(1): company fine Rs 25,000 to Rs 5 lakh"
    sources:
      - title: MCA e-book - Companies (Cost Records and Audit) Rules 2014, Rule 6
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=MzcyMTE=&docCategory=Rules&type=open
        kind: rules
      - title: MCA - G.S.R. 361(E) dated 30-05-2025, Companies (Cost Records and Audit) Amendment Rules 2025
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=NTQwNjExNTg0&docCategory=Notifications&type=open
        kind: notification
      - title: MCA e-book - Companies Act 2013, Section 148 (cost audit)
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=MTk2NzY4NTUy&docCategory=Acts&type=open
        kind: act
      - title: MCA e-book - Companies Act 2013, Section 147 (punishment for contravention)
        url: https://www.mca.gov.in/bin/ebook/dms/getdocument?doc=MjgwNzQ=&docCategory=Acts&type=open
        kind: act
    verified: 2026-10-14
    confidence: medium
    notes: "Modelling: the occurrence labelled FY X (ending 31 March) falls on 27 September of the next financial year, i.e. the CRA-2 for the year that starts on 1 April after period FY X. 27 September is the outer limit; if the Board appoints the cost auditor earlier, CRA-2 is due 30 days after that meeting. A casual vacancy needs CRA-2 within 30 days of the new appointment."
    code: CRA-2
  - id: mca-cra4-annual
    title: CRA-4 cost audit report (XBRL)
    form: CRA-4
    category: mca
    authority: MCA (Cost Audit Branch)
    summary: File the cost audit report with full explanations on qualifications in XBRL within 30 days of receiving it; the cost auditor must give the report to the Board within 180 days of the year end.
    applicability: Companies whose cost records are subject to cost audit.
    audience:
      - company
      - audit
    frequency: annual
    schedule:
      kind: annual
      basis: fy
      daysAfter: 210
      entityYear: true
    law: Section 148(6), Companies Act 2013; Rule 6(5)-(6), Companies (Cost Records and Audit) Rules 2014; Rule 4, Companies (Filing of Documents and Forms in XBRL) Rules 2015
    penalty: "Table B additional fee. Section 148(8)(a) read with Section 147(1): company fine of Rs 25,000 to Rs 5 lakh; officers Rs 10,000 to Rs 1 lakh."
    exposure:
      fixedPenalty: 25000
      maxPenalty: 500000
      other:
        - "Additional fee for late filing: 2x the normal fee up to 30 days late, 4x up to 60 days, 6x up to 90 days, 10x up to 180 days, 12x beyond (Table B, Fees Rules)"
      basis: Section 148(8)(a) read with Section 147(1)
    overrides:
      - period: FY2024-25
        due: 2025-12-31
        originalDue: 2025-10-27
        reason: MCA General Circular No. 07/2025 dated 27-10-2025 (F.No. 17/52/2020-CL-V) allowed CRA-4 for the financial year ended 31-03-2025 to be filed without additional fees up to 31-12-2025
