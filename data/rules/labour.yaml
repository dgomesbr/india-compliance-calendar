  - id: labour-esic-contribution-monthly
    title: ESIC monthly contribution payment
    form: ESIC monthly contribution (online challan)
    category: labour
    authority: ESIC (Employees' State Insurance Corporation)
    summary: File monthly contribution details and pay the employer (3.25%) and employee (0.75%) ESI contributions for the previous month on the ESIC portal.
    applicability: Establishments with 10 or more persons covered by Chapter IV of the Code on Social Security 2020 (hazardous establishments even with one employee); employees whose wages, as defined in the Code from 21 Nov 2025, are up to Rs 21,000 per month.
    audience:
      - employer
      - company
      - llp
      - firm
    frequency: monthly
    schedule:
      kind: monthly
      day: 15
      monthOffset: 1
    law: Chapter IV, Code on Social Security 2020; Rule 19, Social Security (Central) Rules 2026 (contribution rates); Regulations 31, 31-A and 31-C, ESI (General) Regulations 1950 (continued under the Code)
    penalty: Simple interest at 12% per annum for each day of delay (Regulation 31-A; Section 127 and S.O. 2357(E)). Damages under Section 128 and Regulation 31-C at graded maximum rates of 5%, 10%, 15% and 25% per annum for delays under 2, 4, 6 and over 6 months; ESIC decided in June 2025 to replace these with a flat 1% per month. Failure to pay is an offence under Section 133.
    exposure:
      interestPctPerAnnum: 12
      other:
        - Damages u/s 128 / Reg 31-C up to 25% p.a. by length of delay; ESIC approved a flat 1% per month in June 2025 (notification of the amended regulation not verified)
        - "Prosecution u/s 133: imprisonment 1-3 years and Rs 1 lakh fine if the deducted employee share is not paid"
      basis: ESI (General) Regulations r.31-A interest 12% p.a. (also SS Code s.127, S.O. 2357(E)); r.31-C graded damages; SS Code s.133 prosecution
    sources:
