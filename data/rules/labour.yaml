  - id: labour-wages-monthly-payment
    title: Pay monthly wages by the 7th (Code on Wages)
    category: labour
    authority: MoLE / State labour departments (Inspector-cum-Facilitator)
    summary: Pay wages to employees on a monthly wage period before the end of the seventh day of the following month.
    applicability: Every employer, for employees on a monthly wage period. Daily-rated staff are paid at the end of the shift, weekly-rated on the last working day of the week, fortnightly-rated within two days after the fortnight.
    audience:
      - employer
      - company
      - llp
      - firm
    frequency: monthly
    schedule:
      kind: monthly
      day: 7
      monthOffset: 1
    law: Sections 16 and 17(1)(iv), Code on Wages 2019 (in force from 21 Nov 2025)
    penalty: Fine up to Rs 20,000 for contravention (Section 54(1)(c)); fine up to Rs 50,000 if less than the amount due is paid (Section 54(1)(a)); repeat offences within five years can attract imprisonment. The Inspector-cum-Facilitator must first give a written direction to comply (Section 54(3)).
    exposure:
      maxPenalty: 20000
      other:
        - "Underpayment: fine up to Rs 50,000 (s.54(1)(a))"
        - "Repeat within 5 years: imprisonment up to 1 month and fine up to Rs 40,000 (s.54(1)(d))"
      basis: Code on Wages s.54(1)(c) fine up to Rs 20,000; s.54(1)(a) up to Rs 50,000 for paying less than due
    sources:
      - title: Code on Wages, 2019 (Act 29 of 2019) - text on labour.gov.in
        url: https://www.labour.gov.in/static/uploads/2025/06/c328da14bbb15fc4ad571dc33e7a4ab3.pdf
        kind: act
      - title: MoLE - Compliance Handbook for Employers under the Four Labour Codes (Feb 2026)
        url: https://www.labour.gov.in/static/uploads/2026/02/83978455025732b99b0165def80ab171.pdf
        kind: faq
    verified: 2026-10-14
    confidence: high
    notes: The appropriate government may prescribe other time limits (Section 17(3)). Wages on exit are covered by a separate event rule.
    code: WAGES
