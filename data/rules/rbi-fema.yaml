        url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12393&Mode=0
        kind: circular
    verified: 2026-10-14
    confidence: high
    code: FORM LLP
  - id: rbi-fema-grn-quarterly
    title: Form GRN - cross-border guarantees (quarterly)
    form: Form GRN
    category: rbi-fema
    authority: RBI / AD bank
    summary: Report the issue, change (amount, extension, pre-closure) and invocation of guarantees where any party is a person resident outside India, to the AD bank each quarter.
    applicability: Residents who are the surety, or the principal debtor who arranged a guarantee from a non-resident surety, or the creditor where both other parties are non-residents. Guarantees under the Overseas Investment Regulations are excluded (reported in Form FC).
    audience:
      - company
      - llp
      - foreign
    frequency: quarterly
    schedule:
      kind: quarterly
      basis: fy
      day: 15
      monthOffset: 1
    law: Regulations 7 and 8, FEM (Guarantees) Regulations 2026 (FEMA 8(R)/2026-RB dated 06-01-2026)
    penalty: Late submission fee Rs 7,500 + (0.025% x A x n), rounded up to the next hundred; A is the amount involved (for issue or modification reports usually nil, so Rs 7,500).
    exposure:
      fixedPenalty: 7500
      other:
        - "Section 13 FEMA 1999: adjudicated penalty up to 3 times the sum involved (up to Rs 2 lakh where not quantifiable) plus up to Rs 5,000 per day of continuing contravention"
      basis: "Reg 8 FEM (Guarantees) Regulations 2026: Rs 7,500 + 0.025% x A x n"
    effective:
      from: 2026-01-01
      to: null
    sources:
      - title: RBI - FEM (Guarantees) Regulations 2026, FEMA 8(R)/2026-RB dated 06-01-2026
        url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=13269&Mode=0
        kind: notification
      - title: RBI A.P. (DIR Series) Circular No. 19 dated 12-01-2026 (Guarantees Regulations; trade credit guarantee reporting discontinued from quarter ending March 2026)
        url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=13268&Mode=0
        kind: circular
      - title: RBI A.P. (DIR Series) Circular No. 01 dated 01-04-2026 (Form GRN Issue / Modification / Invocation)
        url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=13358&Mode=0
        kind: circular
    verified: 2026-10-14
    confidence: medium
    notes: "New in 2026: the regulations took effect on publication in January 2026 (superseding FEMA 8/2000). A.P. (DIR) 19/2026 discontinued the old trade-credit guarantee return from the quarter ending March 2026, which suggests the first GRN return covered January-March 2026 (due 15-04-2026), but the GRN files were only released on 01-04-2026 (A.P. (DIR) 01/2026), so treat that first quarter as uncertain. Due 15 July, 15 October, 15 January and 15 April. AD banks forward returns to RBI within 30 days of quarter end."
    code: FORM GRN
  - id: rbi-fema-odi-apr-annual
    title: Annual Performance Report (APR) for ODI
    form: APR
    category: rbi-fema
    authority: RBI / AD bank
    summary: File an Annual Performance Report for each foreign entity in which overseas direct investment is held, based on its audited accounts, by 31 December every year.
    applicability: Persons resident in India holding ODI in a foreign entity. Not required if the holding is under 10% without control and only equity, or if the foreign entity is under liquidation. The highest stakeholder files where several residents invest.
    audience:
      - company
      - llp
      - foreign
    frequency: annual
    schedule:
      kind: annual
      basis: fy
      day: 31
      monthOffset: 9
    law: Regulation 10(4), FEM (Overseas Investment) Regulations 2022; Regulations 11 and 12; Master Direction - Overseas Investment para 18
    penalty: Late submission fee of Rs 7,500 per APR (within 3 years of the due date). Until the delay is regularised, no further financial commitment or transfer of the investment is allowed (Regulation 12).
    exposure:
      fixedPenalty: 7500
      other:
        - Block on further financial commitment or transfer until regularised (Reg 12)
        - "Section 13 FEMA 1999: adjudicated penalty up to 3 times the sum involved (up to Rs 2 lakh where not quantifiable) plus up to Rs 5,000 per day of continuing contravention"
      basis: "MD-OI para 18: LSF Rs 7,500 for APR (non-flow return)"
    sources:
      - title: RBI - FEM (Overseas Investment) Regulations 2022
        url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12380&Mode=0
        kind: notification
      - title: RBI - Master Direction - Overseas Investment (updated 01-04-2026), para 18 LSF
        url: https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12710
        kind: circular
    verified: 2026-10-14
    confidence: high
    notes: Where the foreign entity's accounting year ends on 31 December, the APR for that year is due by 31 December of the next year.
    code: APR
  - id: rbi-fema-odi-evidence-event
    title: ODI evidence of investment (share certificates)
    form: Evidence of investment
    category: rbi-fema
    authority: RBI / AD bank
    summary: Submit share certificates or other documents evidencing the overseas direct investment to the AD bank.
    applicability: Persons resident in India acquiring equity capital in a foreign entity that counts as ODI.
    audience:
