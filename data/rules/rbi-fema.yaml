    title: Form FC (ODI commitment, restructuring, exit)
    form: Form FC (including restructuring and disinvestment sections)
    category: rbi-fema
    authority: RBI / AD bank
    summary: Report overseas direct investment financial commitments, and later restructuring or disinvestment of the foreign entity, through the designated AD bank; a UIN must be obtained before the first remittance.
    applicability: Indian entities and resident individuals making ODI or financial commitments in a foreign entity.
    audience:
      - company
      - llp
      - foreign
      - individual
