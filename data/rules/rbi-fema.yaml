      - title: RBI A.P. (DIR Series) Circular No. 16 dated 30-09-2022 (uniform LSF matrix)
        url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12393&Mode=0
        kind: circular
    verified: 2026-10-14
    confidence: high
    code: FORM CN
  - id: rbi-fema-form-di-event
    title: Form DI (downstream investment)
    form: Form DI
    category: rbi-fema
    authority: RBI / DPIIT
    summary: An Indian entity with foreign investment that makes a downstream investment counted as indirect foreign investment reports it to RBI, and notifies DPIIT's Secretariat for Industrial Assistance.
    applicability: Indian entities and investment vehicles making downstream investment that counts as indirect foreign investment for the investee.
    audience:
      - company
      - llp
      - foreign
    frequency: event
    trigger: Form DI within 30 days from the date of allotment of equity instruments; DPIIT (SIA) notice within 30 days of the investment, even before allotment
    law: Regulation 4(11), FEM (Mode of Payment and Reporting of Non-Debt Instruments) Regulations 2019; Rule 22, FEM (Non-debt Instruments) Rules 2019
    penalty: Late submission fee Rs 7,500 + (0.025% x A x n).
    exposure:
      fixedPenalty: 7500
      other:
        - "Section 13 FEMA 1999: adjudicated penalty up to 3 times the sum involved (up to Rs 2 lakh where not quantifiable) plus up to Rs 5,000 per day of continuing contravention"
      basis: "LSF for flow returns: Rs 7,500 + (0.025% x A x n), where A is the amount involved and n the years of delay (rounded up to the month, 2 decimals); capped at 100% of A, rounded up to the next Rs 100; available up to 3 years from the due date"
    sources:
      - title: RBI - FEM (Mode of Payment and Reporting of Non-Debt Instruments) Regulations 2019 (amended up to 13-06-2026)
        url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=11723&Mode=0
        kind: notification
      - title: RBI A.P. (DIR Series) Circular No. 16 dated 30-09-2022 (uniform LSF matrix)
        url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12393&Mode=0
        kind: circular
    verified: 2026-10-14
    confidence: high
    code: FORM DI
  - id: rbi-fema-form-esop-event
    title: Form ESOP (options to non-resident employees)
    form: Form ESOP
    category: rbi-fema
    authority: RBI / AD bank
    summary: Report employee stock options issued to non-resident employees or directors of the company or of its holding company, joint venture or overseas subsidiaries.
    applicability: Indian companies issuing ESOPs to persons resident outside India.
    audience:
      - company
      - foreign
    frequency: event
    trigger: Within 30 days from the date of issue of the employee stock options
    law: Regulation 4(4), FEM (Mode of Payment and Reporting of Non-Debt Instruments) Regulations 2019
    penalty: Late submission fee Rs 7,500 + (0.025% x A x n).
    exposure:
