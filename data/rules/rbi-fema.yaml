  - id: rbi-fema-form-llp-event
    title: Form LLP(I) / LLP(II) (foreign investment in LLP)
    form: Form LLP(I), Form LLP(II)
    category: rbi-fema
    authority: RBI / AD bank
    summary: An LLP reports capital contribution or acquisition of profit shares by non-residents in Form LLP(I); transfers or disinvestment between residents and non-residents are reported in Form LLP(II).
    applicability: LLPs receiving foreign investment (LLP(I)) and resident transferors or transferees of LLP interests (LLP(II)).
    audience:
      - llp
      - foreign
    frequency: event
    trigger: Form LLP(I) within 30 days of receipt of the consideration; Form LLP(II) within 60 days of receipt of funds
    law: Regulation 4(6)-(7), FEM (Mode of Payment and Reporting of Non-Debt Instruments) Regulations 2019
    penalty: Late submission fee Rs 7,500 + (0.025% x A x n).
    exposure:
      fixedPenalty: 7500
      other:
        - "Section 13 FEMA 1999: adjudicated penalty up to 3 times the sum involved (up to Rs 2 lakh where not quantifiable) plus up to Rs 5,000 per day of continuing contravention"
      basis: "LSF for flow returns: Rs 7,500 + (0.025% x A x n), where A is the amount involved and n the years of delay (rounded up to the month, 2 decimals); capped at 100% of A, rounded up to the next Rs 100; available up to 3 years from the due date"
    sources:
      - title: RBI - FEM (Mode of Payment and Reporting of Non-Debt Instruments) Regulations 2019 (amended up to 13-06-2026)
        url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=11723&Mode=0
        kind: notification
