    authority: CBIC / GSTN
    summary: Quarterly statement of outward supplies for taxpayers in the QRMP scheme, covering the third month of the quarter plus any first- and second-month invoices not already uploaded through IFF.
    applicability: Registered persons with AATO up to Rs 5 crore in the preceding FY who have opted for quarterly filing under Rule 61A (QRMP). Nil statement required.
    audience:
      - gst
      - company
      - firm
      - llp
      - individual
    frequency: quarterly
    schedule:
      kind: quarterly
      basis: fy
      day: 13
      monthOffset: 1
    law: Section 37(1) and proviso to Section 39(1), CGST Act 2017; Rules 59 and 61A, CGST Rules 2017; Notifications 83/2020-CT (13th of month after the quarter) and 84/2020-CT
    penalty: "Late fee under Section 47 as limited by Notifications 4/2018-CT and 20/2021-CT: Rs 50 per day combined (Rs 20 if nil), capped at Rs 500 (nil), Rs 2,000 (AATO up to Rs 1.5 crore) or Rs 5,000 (Rs 1.5-5 crore). GSTR-1/IFF is blocked while the previous GSTR-3B is pending (Rule 59(6)); e-way bills blocked after two missed quarters (Rule 138E(c)); barred after three years."
    exposure:
      lateFeePerDay: 50
      lateFeeCap: 5000
      other:
        - E-way bill generation blocked after two missed GSTR-1 quarters (Rule 138E(c))
        - Cannot file GSTR-1/IFF while the preceding GSTR-3B is unfiled (Rule 59(6))
        - Return barred three years after its due date (Sections 37(5), 39(11), 44(2), 52(15)); portal unbarring application possible
      basis: "Section 47(1) read with Notifications 4/2018-CT and 20/2021-CT: Rs 25 CGST + Rs 25 SGST per day (Rs 10 + Rs 10 if no outward supplies); total caps Rs 500 (nil) / Rs 2,000 (AATO up to Rs 1.5 crore) / Rs 5,000 (Rs 1.5-5 crore). No interest as no tax is paid with GSTR-1. QRMP is limited to AATO up to Rs 5 crore, so the Rs 5,000 slab is the highest."
    overrides:
