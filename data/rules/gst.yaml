# gst obligations. See docs/DATA_MODEL.md for the schema.
# Every rule cites its sources; edit with care and keep prose ASCII.
rules:
  - id: gst-bank-account-rule10a
    title: Bank account details after new GST registration
    form: REG-14 (non-core amendment)
    category: gst
    authority: CBIC / GSTN
    summary: A newly registered person must add bank account details on the GST portal within 30 days of registration or before filing the first GSTR-1/IFF, whichever is earlier.
    applicability: All new registrants except TDS/TCS registrations and suo moto (temporary) registrations; not mandatory for OIDAR and non-resident taxpayers unless an OIDAR supplier has a representative in India.
    audience:
      - gst
      - company
      - firm
      - llp
      - individual
    frequency: event
    trigger: Within 30 days of grant of registration, or before furnishing the first GSTR-1/IFF, whichever is earlier
    law: Rule 10A, CGST Rules 2017; Rule 21(d) (cancellation for breach of Rule 10A)
    penalty: Since December 2025 the portal automatically suspends the registration when bank details are not furnished within 30 days; the cancellation proceeding is dropped once details are added. Continued default can lead to cancellation (Rule 21(d)).
    exposure:
      other:
        - Automatic suspension of registration (portal, from December 2025)
        - Cancellation possible under Rule 21(d)
      basis: "Non-monetary: suspension and possible cancellation."
    sources:
      - title: CBIC - CGST Rules 2017, Rule 10A (bank account details)
        url: https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter3/rule10a_v1.00.html
        kind: rules
      - title: CBIC - CGST Rules 2017, Rule 21 (cancellation grounds)
        url: https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter3/rule21_v1.00.html
        kind: rules
      - title: GSTN advisory - Auto suspension for non-furnishing of bank details (05-12-2025)
        url: https://www.gst.gov.in/newsandupdates/read/641
        kind: portal
      - title: GSTN advisory - Furnishing of bank account details as per Rule 10A (20-11-2025)
        url: https://www.gst.gov.in/newsandupdates/read/637
        kind: portal
    verified: 2026-10-14
    confidence: high
    notes: "2025 change: automatic suspension implemented on the portal (GSTN advisory 05-12-2025)."
    code: REG-14
  - id: gst-cmp02-opt-in
    title: CMP-02 opt into composition for next FY
    form: GST CMP-02
    category: gst
    authority: CBIC / GSTN
    summary: Intimation by an existing registered person opting to pay tax under the composition scheme for the coming FY; ITC-03 reversing credit on stock follows within 60 days of the FY start.
    applicability: Registered persons eligible under Section 10 (AATO up to Rs 1.5 crore, Rs 75 lakh in the eight notified States; Rs 50 lakh for the services scheme) who want composition from 1 April.
    audience:
      - gst
      - firm
      - individual
      - company
    frequency: annual
    schedule:
      kind: annual
      basis: fy
      day: 31
      monthOffset: 0
    law: Section 10, CGST Act 2017; Rule 3(3), CGST Rules 2017 ('prior to the commencement of the financial year'); Notification 14/2019-CT
    penalty: No fee or penalty; a late intimation simply means the composition scheme cannot be used for that FY.
    exposure:
      other:
        - Cannot opt into composition for the coming FY; normal GST applies
      basis: No monetary consequence; option lapses for the year.
    sources:
      - title: CBIC - CGST Rules 2017, Rule 3 (composition intimation)
        url: https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter2/rule3_v1.00.html
        kind: rules
      - title: CBIC - CGST Act 2017, Section 10 (composition levy)
        url: https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_CGST_act/active/chapter3/section10_v1.00.html
        kind: act
      - title: CBIC - Notification 14/2019-Central Tax (composition turnover limits)
        url: https://taxinformation.cbic.gov.in/view-pdf/1000701/ENG/Notifications
        kind: notification
    verified: 2026-10-14
    confidence: high
    notes: "Modelling convention: the occurrence dated 31 March at the end of FY X is the last day to opt in for FY X+1. ITC-03 is due within 60 days of the start of the new FY (Rule 3(3))."
    code: CMP-02
  - id: gst-cmp08-composition
    title: CMP-08 quarterly tax statement (composition)
    form: GST CMP-08
    category: gst
    authority: CBIC / GSTN
    summary: Quarterly statement-cum-challan through which composition taxpayers pay the self-assessed composition tax for the quarter in cash.
    applicability: "Persons paying tax under Section 10: goods/restaurant composition with AATO up to Rs 1.5 crore (Rs 75 lakh in Arunachal Pradesh, Manipur, Meghalaya, Mizoram, Nagaland, Sikkim, Tripura, Uttarakhand) and the services scheme under Section 10(2A) up to Rs 50 lakh. Nil statement required."
    audience:
      - gst
      - firm
      - individual
      - company
    frequency: quarterly
    schedule:
      kind: quarterly
      basis: fy
      day: 18
      monthOffset: 1
    law: Section 10 and second proviso to Section 39(7), CGST Act 2017; Rule 62(1)(i), CGST Rules 2017; Notification 14/2019-CT (turnover limits)
    penalty: No late fee for CMP-08 (GST portal FAQ). Interest at 18% p.a. under Section 50 on tax paid late. Two consecutive missed quarters block e-way bills (Rule 138E(a)).
    exposure:
      interestPctPerAnnum: 18
      other:
        - E-way bill generation blocked after two consecutive missed CMP-08 statements (Rule 138E(a))
      basis: "GST portal FAQ: no late fee for CMP-08; Section 50(1) interest 18% p.a. on late tax."
    sources:
      - title: CBIC - CGST Rules 2017, Rule 62 (CMP-08, GSTR-4)
        url: https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter8/rule62_v1.00.html
        kind: rules
      - title: CBIC - CGST Act 2017, Section 10 (composition levy)
        url: https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_CGST_act/active/chapter3/section10_v1.00.html
        kind: act
      - title: CBIC - Notification 14/2019-Central Tax (composition turnover limits)
        url: https://taxinformation.cbic.gov.in/view-pdf/1000701/ENG/Notifications
        kind: notification
      - title: GST portal FAQ - Form GST CMP-08 (due date, no late fee)
        url: https://tutorial.gst.gov.in/userguide/returns/FAQs_CMP02.htm
        kind: faq
      - title: CBIC - CGST Rules 2017, Rule 138E (e-way bill blocking)
        url: https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter16/rule138e_v1.00.html
        kind: rules
    verified: 2026-10-14
    confidence: high
    notes: Due 18 Jul, 18 Oct, 18 Jan and 18 Apr. The annual composition return is GSTR-4 (gst-gstr4-annual).
    code: CMP-08
    tags:
      - gst-composition
  - id: gst-einvoice-30-day-reporting
    title: E-invoice IRP reporting within 30 days (AATO Rs 10 cr+)
    form: e-invoice (IRN)
    category: gst
    authority: CBIC / GSTN
    summary: Invoices, credit notes and debit notes must be reported to the Invoice Registration Portal within 30 days of the document date; the IRP rejects older documents.
    applicability: Taxpayers with aggregate annual turnover of Rs 10 crore or more (from 1 April 2025; the limit first applied to AATO of Rs 100 crore and above under a GSTN advisory of 13-09-2023). E-invoicing itself is mandatory once AATO in any FY from 2017-18 exceeds Rs 5 crore (Notification 10/2023-CT).
    audience:
      - gst
      - company
      - firm
      - llp
    frequency: event
    trigger: Within 30 days of the date of each invoice, credit note or debit note requiring an IRN
    law: Rule 48(4)-(6), CGST Rules 2017; Notification 13/2020-CT as amended by Notification 10/2023-CT; GSTN advisory dated 05-11-2024 (portal validation)
    penalty: The IRP rejects documents older than 30 days. An invoice not issued through the IRP is not a valid invoice (Rule 48(5)), so the buyer's ITC is at risk and the supplier faces penalty under Section 122 (higher of Rs 10,000 or the tax involved for supply without a valid invoice; up to Rs 25,000 under Section 122(3)(e)).
    exposure:
      fixedPenalty: 10000
      other:
        - Invoice invalid without IRN; buyer's ITC denied
      basis: Rule 48(5) invalidity; Section 122(1)(i) penalty of the higher of Rs 10,000 or tax evaded; Section 122(3)(e) up to Rs 25,000.
    effective:
      from: 2025-04-01
      to: null
    sources:
      - title: GSTN advisory - Time limit for reporting e-invoices, AATO Rs 10 crore and above (05-11-2024)
        url: https://www.gst.gov.in/newsandupdates/read/543
        kind: portal
      - title: CBIC - CGST Rules 2017, Rule 48 (manner of issuing invoice, e-invoice)
        url: https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter6/rule48_v1.00.html
        kind: rules
      - title: CBIC - Notification 10/2023-Central Tax (e-invoicing above Rs 5 crore)
        url: https://taxinformation.cbic.gov.in/view-pdf/1009732/ENG/Notifications
        kind: notification
      - title: CBIC - Notification 13/2020-Central Tax (e-invoice class of persons)
        url: https://taxinformation.cbic.gov.in/view-pdf/1000623/ENG/Notifications
        kind: notification
      - title: CBIC - CGST Act 2017, Section 122 (penalties)
        url: https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_CGST_act/active/chapter19/section122_v1.00.html
        kind: act
    verified: 2026-10-14
    confidence: high
    notes: The 30-day limit is a portal validation announced by GSTN, not a separate notification. No further lowering of the threshold was found as of October 2026. The 57th Council recommended extending e-invoicing to RCM purchases from unregistered persons and to import of services for AATO of Rs 5 crore and above; not yet notified.
    code: E-INVOICE
  - id: gst-first-appeal
    title: First appeal to Appellate Authority (APL-01)
    form: GST APL-01
    category: gst
    authority: CBIC / State GST departments
    summary: Appeal against an adjudication order to the Appellate Authority (Commissioner (Appeals) or State equivalent), with the mandatory pre-deposit.
    applicability: Any person aggrieved by a decision or order of an adjudicating authority under the CGST/SGST/UTGST Acts.
    audience:
      - gst
      - company
      - firm
      - llp
      - individual
    frequency: event
    trigger: Within three months from the date the order is communicated (the Appellate Authority may allow one further month for sufficient cause)
    law: Section 107(1), (4) and (6), CGST Act 2017
    penalty: "Appeal barred beyond the condonable period. Pre-deposit: the admitted amount plus 10% of disputed tax (capped at Rs 20 crore CGST); for penalty-only orders, 10% of the penalty (from 1-10-2025)."
    exposure:
      other:
        - Order becomes final if not appealed in time
        - Pre-deposit of 10% of disputed tax (cap Rs 20 crore CGST) or 10% of penalty for penalty-only orders
      basis: Limitation under Section 107; pre-deposit under Section 107(6).
    sources:
      - title: CBIC - CGST Act 2017, Section 107 (first appeal)
        url: https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_CGST_act/active/chapter18/section107_v1.00.html
        kind: act
      - title: CBIC - Notification 16/2025-Central Tax (Finance Act 2025 provisions from 1-10-2025)
        url: https://taxinformation.cbic.gov.in/view-pdf/1010466/ENG/Notifications
        kind: notification
    verified: 2026-10-14
    confidence: high
    notes: The penalty-only pre-deposit proviso came from the Finance Act 2025 (in force 1-10-2025). The 57th Council recommended a Rs 40 crore (Rs 20 crore CGST + Rs 20 crore SGST) ceiling for penalty-only orders; not yet enacted.
    code: APL-01
  - id: gst-gstat-appeal
    title: Appeal to GST Appellate Tribunal (GSTAT)
    form: GST APL-05
    category: gst
    authority: GSTAT / Department of Revenue
    summary: Second appeal, filed online on the GSTAT e-filing portal, against an order of the Appellate Authority or Revisional Authority, with the additional pre-deposit.
    applicability: Taxpayers aggrieved by orders under Section 107 or 108 (the Tribunal may decline cases where tax, ITC, fine, fee or penalty involved is Rs 50,000 or less).
    audience:
      - gst
      - company
      - firm
      - llp
      - individual
    frequency: event
    trigger: Within three months from communication of the first-appeal or revision order (cross-objections within 45 days of notice); orders communicated before 1 May 2026 could be appealed until 31 July 2026
    law: Section 112(1), (5), (6) and (8), CGST Act 2017; GSTAT (Procedure) Rules 2025; Department of Revenue notification under Section 112 dated 30-06-2026 (superseding S.O. 4220(E) dated 17-09-2025)
    penalty: Late appeals can be admitted only within a further three months for sufficient cause (Section 112(6)). Pre-deposit of 10% of the remaining disputed tax in addition to the first-appeal deposit, capped at Rs 20 crore CGST; 10% of penalty for penalty-only orders (from 1-10-2025).
    exposure:
      other:
        - Order becomes final if not appealed in time
        - Additional pre-deposit of 10% of remaining disputed tax (cap Rs 20 crore CGST)
      basis: Limitation and condonation under Section 112(1) and (6); pre-deposit under Section 112(8).
    sources:
      - title: CBIC - CGST Act 2017, Section 112 (appeal to GSTAT)
        url: https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_CGST_act/active/chapter18/section112_v1.00.html
        kind: act
      - title: Department of Revenue notification dated 30-06-2026 under Section 112 (GSTAT outer date 31-07-2026)
        url: https://efiling.gstat.gov.in/downloads/manual/GSTAT_Due_date_Notification.pdf
        kind: notification
      - title: "GSTAT - What's new: GSTAT due date notification (30-06-2026)"
        url: https://gstat.gov.in/whats-new/32
        kind: portal
      - title: CBIC - Notification 13/2025-Central Tax (CGST Third Amendment Rules 2025)
        url: https://taxinformation.cbic.gov.in/view-pdf/1010462/ENG/Notifications
        kind: notification
      - title: CBIC - Notification 02/2026-Central Tax (GSTAT Principal Bench, Section 101B)
        url: https://taxinformation.cbic.gov.in/view-pdf/1010680/ENG/Notifications
        kind: notification
      - title: Taxguru - GSTAT appeal deadlines and S.O. 4220(E) dated 17-09-2025
        url: https://taxguru.in/goods-and-service-tax/gstat-appeal-deadlines-clarified-backlog-cases-filed-30-june-2026.html
        kind: secondary
    verified: 2026-10-14
    confidence: high
    notes: GSTAT e-filing opened in September 2025 with a staggered, batch-wise filing schedule (window dates per secondary source). Appeal forms were substituted by Notification 13/2025-CT (from 22-09-2025), including rule 110A for single-member benches. From 1 April 2026 the Principal Bench also hears appeals under Section 101B (Notification 02/2026-CT). See gst-gstat-backlog-deadline for the one-time outer date.
    code: APL-05
  - id: gst-gstat-backlog-deadline
    title: GSTAT backlog appeals outer date (31 Jul 2026)
    form: GST APL-05
    category: gst
    authority: GSTAT / Department of Revenue
    summary: "One-time outer date for filing GSTAT appeals against first-appeal or revision orders communicated before 1 May 2026 (departmental applications: orders passed before 1 February 2026)."
    applicability: Taxpayers with Section 107/108 orders communicated before 1 May 2026 that had not yet been appealed to GSTAT.
    audience:
      - gst
      - company
      - firm
      - llp
      - individual
    frequency: one-time
    schedule:
      kind: fixed
      dates:
        - due: 2026-07-31
          period: Orders communicated before 2026-05-01
    trigger: Fixed outer date notified under Section 112(1) and (3)
    law: Section 112(1) and (3), CGST Act 2017; Department of Revenue notification dated 30-06-2026 (F. No. A-50/7/2025-GSTAT-DoR), superseding S.O. 4220(E) dated 17-09-2025
    penalty: Appeals after the outer date are time-barred, subject only to condonation within three months under Section 112(6).
    exposure:
      other:
        - Backlog appeal time-barred after the outer date
      basis: Limitation; no fee.
    sources:
      - title: Department of Revenue notification dated 30-06-2026 under Section 112 (GSTAT outer date 31-07-2026)
        url: https://efiling.gstat.gov.in/downloads/manual/GSTAT_Due_date_Notification.pdf
        kind: notification
      - title: "GSTAT - What's new: GSTAT due date notification (30-06-2026)"
        url: https://gstat.gov.in/whats-new/32
        kind: portal
      - title: Taxguru - GSTAT appeal deadlines and S.O. 4220(E) dated 17-09-2025
        url: https://taxguru.in/goods-and-service-tax/gstat-appeal-deadlines-clarified-backlog-cases-filed-30-june-2026.html
        kind: secondary
    verified: 2026-10-14
    confidence: high
    notes: The earlier S.O. 4220(E) (17-09-2025) had set 30-06-2026 for orders communicated before 1-04-2026 (details from secondary source; the S.O. itself was not opened). Orders communicated on or after 1 May 2026 follow the normal three-month limit (gst-gstat-appeal). The GSTAT portal also accepted a recorded 'intent to file' by 31-07-2026 as timely filing where users faced registration or e-filing problems.
    code: APL-05
  - id: gst-gstr1-monthly
    title: GSTR-1 outward supplies (monthly filers)
    form: GSTR-1
    category: gst
    authority: CBIC / GSTN
    summary: Statement of outward supplies for the month (B2B invoices, B2C summaries, exports, credit/debit notes, HSN summary). It feeds buyers' GSTR-2B/IMS and auto-populates the supplier's GSTR-3B liability.
    applicability: Every regular registered person not in the QRMP scheme (mandatory monthly filing once AATO exceeds Rs 5 crore). Not for composition taxpayers, ISD, non-resident persons, OIDAR suppliers, TDS deductors or TCS collectors. A nil statement is required for months with no supplies.
    audience:
      - gst
      - company
      - firm
      - llp
      - individual
    frequency: monthly
    schedule:
      kind: monthly
      day: 11
      monthOffset: 1
    law: Section 37(1), CGST Act 2017; Rule 59, CGST Rules 2017; Notification 83/2020-Central Tax (11th of the following month)
    penalty: "Late fee under Section 47 as limited by Notifications 4/2018-CT and 20/2021-CT: Rs 50 per day combined (Rs 20 if nil), capped at Rs 500 for nil statements, Rs 2,000 (AATO up to Rs 1.5 crore), Rs 5,000 (Rs 1.5-5 crore) and the statutory Rs 10,000 above Rs 5 crore. GSTR-1 cannot be filed while the previous GSTR-3B is pending (Rule 59(6)); two missed periods block e-way bills (Rule 138E(c)); filing is barred three years after the due date (Section 37(5))."
    exposure:
      lateFeePerDay: 50
      lateFeeCap: 10000
      other:
        - E-way bill generation blocked after two missed GSTR-1 periods (Rule 138E(c))
        - Cannot file GSTR-1 while the preceding GSTR-3B is unfiled (Rule 59(6))
        - Buyers do not see the invoices in GSTR-2B, putting their ITC at risk
        - Return barred three years after its due date (Sections 37(5), 39(11), 44(2), 52(15)); portal unbarring application possible
      basis: "Section 47(1) read with Notifications 4/2018-CT and 20/2021-CT: Rs 25 CGST + Rs 25 SGST per day (Rs 10 + Rs 10 if no outward supplies); total caps Rs 500 (nil) / Rs 2,000 (AATO up to Rs 1.5 crore) / Rs 5,000 (Rs 1.5-5 crore) / Rs 10,000 statutory (above Rs 5 crore). No interest as no tax is paid with GSTR-1."
    overrides:
      - period: 2024-12
        due: 2025-01-13
        originalDue: 2025-01-11
        reason: Extended by Notification 01/2025-Central Tax dated 10-01-2025
        source:
          title: CBIC - Notification 01/2025-Central Tax (GSTR-1 December 2024 extension)
          url: https://taxinformation.cbic.gov.in/view-pdf/1010249/ENG/Notifications
    sources:
      - title: CBIC - Notification 83/2020-Central Tax (GSTR-1 due dates)
        url: https://taxinformation.cbic.gov.in/view-pdf/1000547/ENG/Notifications
        kind: notification
      - title: CBIC - CGST Rules 2017, Rule 59 (GSTR-1, IFF, GSTR-1A)
        url: https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter8/rule59_v1.00.html
        kind: rules
      - title: CBIC - CGST Act 2017, Section 37 (outward supplies)
        url: https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_CGST_act/active/chapter9/section37_v1.00.html
        kind: act
      - title: CBIC - Notification 20/2021-Central Tax (GSTR-1 late fee)
        url: https://taxinformation.cbic.gov.in/view-pdf/1000513/ENG/Notifications
        kind: notification
      - title: CBIC - Notification 4/2018-Central Tax (GSTR-1 late fee per day)
        url: https://taxinformation.cbic.gov.in/view-pdf/1000794/ENG/Notifications
        kind: notification
      - title: CBIC - Notification 01/2025-Central Tax (GSTR-1 December 2024 extension)
        url: https://taxinformation.cbic.gov.in/view-pdf/1010249/ENG/Notifications
        kind: notification
      - title: GSTN advisory - Extension of due date for GSTR-1 and GSTR-3B (10-01-2025)
        url: https://www.gst.gov.in/newsandupdates/read/571
        kind: portal
    verified: 2026-10-14
    confidence: high
    notes: QRMP taxpayers use gst-gstr1-quarterly-qrmp and the optional IFF instead. Same-period corrections go in GSTR-1A before GSTR-3B is filed (gst-gstr1a-amendment). Since the July 2025 period the liability that GSTR-1/1A/IFF auto-populates into GSTR-3B is locked, so GSTR-1 accuracy now drives GSTR-3B. The 57th GST Council (8 Oct 2026) recommended GSTR-1/1A/IFF enhancements and an alternate amendment mechanism from the April 2027 return; not notified as of 14 Oct 2026.
    code: GSTR-1
    tags:
      - gst-monthly
