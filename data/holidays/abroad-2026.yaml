        name: Victoria Day
      - date: 2026-07-01
        name: Canada Day
      - date: 2026-09-07
        name: Labour Day
      - date: 2026-10-12
        name: Thanksgiving Day
      - date: 2026-12-25
        name: Christmas Day
      - date: 2026-12-26
        name: Boxing Day
        note: "A Saturday: employees not ordinarily working that day get a substitute day off (Employment Standards Act s. 29); the Ministry of Finance banking schedule uses Monday 28 December."
  - id: ca-on-bank-2026
    title: "Ontario bank holidays 2026: Canadian payment system closures (Payments Canada Lynx and ACSS)"
    kind: bank
    scope: CA-ON
    year: 2026
    authority: Payments Canada (operator of Lynx and the ACSS)
    source:
      title: Payments Canada, system closure schedule
      url: https://www.payments.ca/system-closure-schedule
    alsoSee:
      - title: Payments Canada, jours d'inactivite des systemes (French)
        url: https://www.paiements.ca/systemes-et-services/payment-systems/jours-dinactivite-des-systemes
      - title: Bank of Canada holiday schedule
        url: https://www.bankofcanada.ca/press/upcoming-events/bank-of-canada-holiday-schedule/
      - title: Bills of Exchange Act, R.S.C. 1985, c. B-4, s. 42 (non-juridical days)
        url: https://laws-lois.justice.gc.ca/eng/acts/B-4/section-42.html
    verified: 2026-10-16
    confidence: high
    notes: Payments Canada's systems run Monday to Friday except the ten federal statutory holidays below; a holiday on a weekend closes them on the next business day. Easter Monday, Family Day and the Civic Holiday are processing days, although many branches and the Bank of Canada's own offices close on Family Day and the Civic Holiday, and the Ontario Ministry of Finance's banking schedule for provincial tax due dates adds those three days.
