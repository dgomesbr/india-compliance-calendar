    verified: 2026-10-15
    confidence: high
    notes: Reserve Banks and Branches close on the federal holidays, except that for a Saturday holiday they stay open the Friday before (only the Board of Governors closes) and for a Sunday holiday all Federal Reserve offices close the Monday after. Independence Day falls on Saturday 4 July 2026, so Reserve Banks are open on Friday 3 July although federal offices observe the holiday that day.
