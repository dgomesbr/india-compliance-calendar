    notes: "The eleven legal public holidays of 5 U.S.C. 6103(a) on the dates OPM sets for Monday-to-Friday employees: a Saturday holiday is observed the Friday before (6103(b)) and a Sunday holiday the Monday after (Executive Order 11582). A closure added by executive order (as for 24 and 26 December 2025) is recorded when it is published."
