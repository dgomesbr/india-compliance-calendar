        note: "A Saturday: where it is a non-working day the employee gets the working day immediately before or after (Canada Labour Code s. 193(2))."
  - id: ca-on-statutory-2026
    title: Ontario public holidays 2026 (Employment Standards Act, 2000)
    kind: statutory
    scope: CA-ON
    year: 2026
    authority: Government of Ontario, Ministry of Labour, Immigration, Training and Skills Development (Employment Standards Act, 2000, S.O. 2000, c. 41)
    source:
      title: "Your guide to the Employment Standards Act: public holidays (ontario.ca)"
      url: https://www.ontario.ca/document/your-guide-employment-standards-act-0/public-holidays
    alsoSee:
      - title: Employment Standards Act, 2000, s. 1(1) public holiday and s. 29 public holiday not ordinarily a working day (e-Laws)
        url: https://www.ontario.ca/laws/statute/00e41
      - title: Ontario Ministry of Finance, Ontario and federally recognized banking holiday schedule (Ontario tax due dates)
        url: https://www.ontario.ca/page/pay-ontario-taxes-and-charges
    verified: 2026-10-15
    confidence: high
    notes: The nine public holidays of the Employment Standards Act (s. 1(1)). Employers are not required under the Act to give Easter Monday, the Civic Holiday (first Monday in August), Remembrance Day or the National Day for Truth and Reconciliation. A public holiday on a day that is not ordinarily a working day earns a substitute working day off with public holiday pay within three months, or public holiday pay by written agreement (s. 29).
