        name: Victoria Day
      - date: 2027-07-01
        name: Canada Day
      - date: 2027-09-06
        name: Labour Day
      - date: 2027-09-30
        name: National Day for Truth and Reconciliation
      - date: 2027-10-11
        name: Thanksgiving Day
      - date: 2027-11-11
        name: Remembrance Day
      - date: 2027-12-27
        name: Christmas Day
        actual: 2027-12-25
        note: Expected closure for Christmas Day, which falls on Saturday 25 December.
      - date: 2027-12-28
        name: Boxing Day
        actual: 2027-12-26
        note: Expected closure for Boxing Day, which falls on Sunday 26 December; the Monday is taken by Christmas Day.
