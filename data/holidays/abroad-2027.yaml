    verified: 2026-10-15
    confidence: high
    notes: Reserve Banks are open on Friday 18 June, Friday 24 December and Friday 31 December 2027 (Saturday holidays; the Board of Governors closes), and all offices close on Monday 5 July for Independence Day on a Sunday. Friday 31 December 2027 is therefore not a Reserve Bank holiday although it is a federal holiday.
