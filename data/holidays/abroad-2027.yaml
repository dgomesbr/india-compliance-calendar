      - date: 2027-10-11
        name: Thanksgiving Day
      - date: 2027-11-11
        name: Remembrance Day
      - date: 2027-12-25
        name: Christmas Day
        note: "A Saturday: where it is a non-working day the employee gets the working day immediately before or after (Canada Labour Code s. 193(2))."
      - date: 2027-12-26
        name: Boxing Day
        note: "A Sunday: where it is a non-working day the employee gets the working day immediately before or after (Canada Labour Code s. 193(2))."
  - id: ca-on-statutory-2027
    title: Ontario public holidays 2027 (Employment Standards Act, 2000)
    kind: statutory
    scope: CA-ON
    year: 2027
    authority: Government of Ontario, Ministry of Labour, Immigration, Training and Skills Development (Employment Standards Act, 2000, S.O. 2000, c. 41)
    source:
      title: "Your guide to the Employment Standards Act: public holidays (ontario.ca)"
      url: https://www.ontario.ca/document/your-guide-employment-standards-act-0/public-holidays
    alsoSee:
      - title: Employment Standards Act, 2000, s. 1(1) public holiday and s. 29 public holiday not ordinarily a working day (e-Laws)
        url: https://www.ontario.ca/laws/statute/00e41
      - title: Labour Program calculator data with the 2027 dates of the eight holidays shared with the Canada Labour Code
        url: https://wages-salaires.service.canada.ca/_conf/assets/js/general_holiday.js
    verified: 2026-10-15
    confidence: medium
    notes: Ontario has not published dated public holidays for 2027; these follow the Employment Standards Act (s. 1(1); Family Day is the third Monday in February) and match the Labour Program's published 2027 dates for the eight holidays the two lists share. Christmas Day (Saturday) and Boxing Day (Sunday) bring the s. 29 substitute-day rule for employees not ordinarily working those days.
    holidays:
      - date: 2027-01-01
        name: New Year's Day
      - date: 2027-02-15
        name: Family Day
      - date: 2027-03-26
        name: Good Friday
      - date: 2027-05-24
        name: Victoria Day
      - date: 2027-07-01
        name: Canada Day
      - date: 2027-09-06
        name: Labour Day
      - date: 2027-10-11
        name: Thanksgiving Day
      - date: 2027-12-25
        name: Christmas Day
        note: "A Saturday: employees not ordinarily working that day get a substitute day off (Employment Standards Act s. 29)."
      - date: 2027-12-26
        name: Boxing Day
        note: "A Sunday: employees not ordinarily working that day get a substitute day off (Employment Standards Act s. 29)."
  - id: ca-on-bank-2027
    title: "Ontario bank holidays 2027: Canadian payment system closures (Payments Canada Lynx and ACSS)"
    kind: bank
    scope: CA-ON
    year: 2027
    authority: Payments Canada (operator of Lynx and the ACSS)
    source:
      title: Payments Canada, system closure schedule (2027 not yet published)
      url: https://www.payments.ca/system-closure-schedule
    alsoSee:
      - title: Archived Payments Canada closure schedule, December 2022 (weekend holidays closed the next business day)
        url: https://web.archive.org/web/20221219221000/https://www.payments.ca/system-closure-schedule
      - title: Archived Payments Canada closure schedule, October 2023 (Saturday holidays closed the following Monday)
        url: https://web.archive.org/web/20231001000335/https://www.payments.ca/system-closure-schedule
      - title: Bank of Canada holiday schedule
        url: https://www.bankofcanada.ca/press/upcoming-events/bank-of-canada-holiday-schedule/
      - title: Bills of Exchange Act, R.S.C. 1985, c. B-4, s. 42 (non-juridical days)
        url: https://laws-lois.justice.gc.ca/eng/acts/B-4/section-42.html
    verified: 2026-10-15
    confidence: medium
    notes: Payments Canada has not published its 2027 schedule; these dates apply its stated rule (closed on the ten federal statutory holidays) and its practice, shown in its 2022 and 2023 schedules, of closing on the next business day for a weekend holiday, and on the Tuesday when Christmas takes the Monday. New Year's Day 2028 is a Saturday, so by the same practice the closure is Monday 3 January 2028, not Friday 31 December 2027.
    holidays:
