    notes: Juneteenth and Christmas Day fall on Saturdays (observed Fridays 18 June and 24 December) and Independence Day on a Sunday (observed Monday 5 July). New Year's Day 2028 is a Saturday, so Friday 31 December 2027 is a federal holiday; OPM lists it on its 2028 schedule.
