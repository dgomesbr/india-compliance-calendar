# Holiday calendars abroad for 2027: Canada, Ontario and the United States.
lists:
  - id: ca-federal-2027
    title: Canada federal statutory holidays 2027 (Canada Labour Code general holidays)
    kind: statutory
    scope: CA
    year: 2027
    authority: Employment and Social Development Canada, Labour Program (Canada Labour Code, R.S.C. 1985, c. L-2, s. 166)
    source:
      title: Labour Program general holiday pay calculator (lists each general holiday with its date)
      url: https://wages-salaires.service.canada.ca/en/gen_holiday/index.html
    alsoSee:
      - title: Canada Labour Code s. 166, definition of general holiday
        url: https://laws-lois.justice.gc.ca/eng/acts/L-2/section-166.html
      - title: Canada Labour Code s. 193, general holiday falling on a non-working day
        url: https://laws-lois.justice.gc.ca/eng/acts/L-2/section-193.html
      - title: Labour Program calculator data file with the dated list
        url: https://wages-salaires.service.canada.ca/_conf/assets/js/general_holiday.js
      - title: Holidays Act, R.S.C. 1985, c. H-5
        url: https://laws-lois.justice.gc.ca/eng/acts/H-5/FullText.html
    verified: 2026-10-16
    confidence: high
    notes: The same ten Canada Labour Code general holidays, dated from the Labour Program's published 2027 list. Christmas Day falls on a Saturday and Boxing Day on a Sunday; where those are non-working days the employee gets the working day immediately before or after (s. 193(2)).
