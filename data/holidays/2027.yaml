    notes: Applies to Central Government administrative offices in Delhi/New Delhi. Offices elsewhere observe the 14 compulsory holidays plus 3 optional ones chosen by the Central Government Employees Welfare Coordination Committee of the state capital, so state lists differ. Dates of Id-ul-Fitr, Id-ul-Zuha, Muharram and Id-e-Milad can be changed at short notice depending on moon sighting. Dr. B.R. Ambedkar's Birthday (14 Apr 2027) is not in the list; DoPT normally declares it by a separate OM shortly before the date. Independence Day and Milad-un-Nabi both fall on Sunday 15 Aug 2027.
