name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # 06:00 IST every day: refresh regulator feeds and roll the date windows.
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate data
        run: npm run validate
      - name: Test
        run: npm test
      - name: Restore last collected feeds
        uses: actions/cache/restore@v6
        with:
          path: data/updates.json
          key: feeds-${{ github.run_id }}
          restore-keys: feeds-
      - name: Collect regulator feeds
        run: node scripts/fetch-feeds.ts
        continue-on-error: true
      - name: Collect reference exchange rates
        run: node scripts/fetch-fx.ts
        continue-on-error: true
      - name: Keep collected feeds for the next run
        uses: actions/cache/save@v6
        with:
          path: data/updates.json
          key: feeds-${{ github.run_id }}
      - uses: actions/configure-pages@v6
      - name: Build
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
