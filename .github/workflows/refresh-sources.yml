name: Refresh sources

on:
  schedule:
    # Every other day at 05:30 IST (00:00 UTC), ahead of the 06:00 IST build. Day-of-month
    # stepping means the 31st and the 1st both run; the job is idempotent, so that is harmless.
    - cron: '0 0 */2 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-sources
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check holiday calendars and every cited source
        run: node scripts/refresh-sources.ts >> "$GITHUB_STEP_SUMMARY"
      - name: Validate and test what changed
        run: |
          npm run validate
          npm test
      - name: Commit the refreshed data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): refresh sources $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild the site with the refreshed data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
